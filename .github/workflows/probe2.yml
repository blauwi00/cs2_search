name: probe2
on: { push: { branches: [probe2] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const urls = [
            'https://prices.csgotrader.app/latest/steam.json',
            'https://prices.csgotrader.app/latest/prices_v6.json',
            'https://prices.csgotrader.app/latest/skinport.json',
            'https://market.csgo.com/api/v2/prices/steam/USD.json',
            'https://csgobackpack.net/api/GetItemsList/v2/?no_details=true',
          ];
          for (const u of urls) {
            try {
              const r = await fetch(u, { headers: { 'User-Agent': 'cs2-market-bot-collector/1.0', 'Accept-Encoding': 'gzip, br' } });
              const t = await r.text();
              console.log('####', r.status, t.length, u, r.headers.get('last-modified'));
              let j = null; try { j = JSON.parse(t); } catch {}
              if (j && !Array.isArray(j)) { const k = Object.keys(j); console.log('keys', k.length, JSON.stringify({ [k[0]]: j[k[0]], 'Revolution Case': j['Revolution Case'], 'AK-47 | Redline (Field-Tested)': j['AK-47 | Redline (Field-Tested)'] }).slice(0, 900)); }
              else console.log(t.slice(0, 300));
            } catch (e) { console.log('####', 'ERR', u, e.message); }
          }
          JS
          node p.mjs
