function api(path, opt) {
  opt = opt || {};
  return fetch('/app/api/' + path, {
    method: opt.method || 'GET',
    headers: { 'X-Init-Data': INIT, 'Content-Type': 'application/json' },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  }).then(function (r) {
    return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }).then(function (j) {
      if (r.status === 403) throw new Error('Нет доступа. Открой приложение кнопкой в своём боте.');

      if (j.cur && j.cur.per > 0) CUR = j.cur;

// ---------- Состояние: зелёный — всё работает; жёлтый — работает, но Steam/Skinport временно ограничены; красный — бот стоит ----------
function health(s) {
  var by = {}; s.sources.forEach(function (x) { by[x.source] = x; });
  var col = by.collector, now = Date.now() / 1000;
  var collectorOk = col && col.lastOk && now - col.lastOk < 45 * 60;
  if (!s.cronAlive || !collectorOk) return { cls: 'bad', icon: '🔴', title: 'Цены не обновляются', note: !s.cronAlive ? 'Планировщик бота не запускался больше 5 минут.' : 'Сборщик цен давно не присылал данные. Владелец бота получит уведомление.' };
  // Ограничения Steam — обычное дело (бот берёт средние цены продаж), поэтому их не показываем.
  var sp = by.skinport;
  if (sp && sp.status !== 'ok') return { cls: 'warn', icon: '🟡', title: 'Работает, но Skinport отвечает с ошибками', note: 'Остальные площадки обновляются.' };
  return { cls: 'ok', icon: '🟢', title: 'Всё работает', note: '' };
}

}

function chart(series, days, avg) {
  var W = 340, H = 170, L = 44, R = 6, T = 8, B = 22;
  var defs = [['steamLow', 'Steam объявление', '#8b6cff'], ['steamMed', 'Steam медиана', '#2fbf71'], ['skinport', 'Skinport', '#f2a93b']];
  var all = []; defs.forEach(function (d) { (series[d[0]] || []).forEach(function (p) { if (p.v != null) all.push(p.v); }); });
  if (all.length < 2) return '<div class="empty" style="padding:22px">📉 История ещё копится.<br><span style="font-size:13px">Точки появляются при каждом сборе цен.</span></div>';
  var now = Date.now() / 1000, from = now - days * 86400;
  if (avg) all.push(avg);
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all); if (mn === mx) { mn -= 100; mx += 100; }
  var pad = (mx - mn) * .1; mn = Math.max(0, mn - pad); mx += pad;
  function x(t) { return L + (t - from) / (now - from) * (W - L - R); }
  function y(v) { return T + (1 - (v - mn) / (mx - mn)) * (H - T - B); }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
  for (var i = 0; i <= 3; i++) { var v = mn + (mx - mn) * i / 3; s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="currentColor" stroke-opacity=".1"/><text x="' + (L - 5) + '" y="' + (y(v) + 3).toFixed(1) + '" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".55">' + Math.round(v / 100) + '</text>'; }
  for (var j = 0; j <= 3; j++) { var t = from + (now - from) * j / 3, dt = new Date(t * 1000); s += '<text x="' + x(t).toFixed(1) + '" y="' + (H - 6) + '" font-size="9" text-anchor="middle" fill="currentColor" fill-opacity=".55">' + String(dt.getDate()).padStart(2, '0') + '.' + String(dt.getMonth() + 1).padStart(2, '0') + '</text>'; }
  if (avg) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(avg).toFixed(1) + '" y2="' + y(avg).toFixed(1) + '" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="' + (W - R) + '" y="' + (y(avg) - 4).toFixed(1) + '" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".7">средняя 7 дн</text>';
  var gap = Math.max(3 * 3600, days * 86400 / 40);
  defs.forEach(function (d) {
    var pts = (series[d[0]] || []).filter(function (p) { return p.v != null && p.t >= from; }), seg = [], last = null;
    function flush() { if (seg.length > 1) s += '<polyline fill="none" stroke="' + d[2] + '" stroke-width="2" stroke-linejoin="round" points="' + seg.join(' ') + '"/>'; else if (seg.length === 1) { var c = seg[0].split(','); s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="2.2" fill="' + d[2] + '"/>'; } seg = []; }
    pts.forEach(function (p) { if (last != null && p.t - last > gap) flush(); seg.push(x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)); last = p.t; });
    flush();
  });
  s += '</svg><div class="legend">' + defs.filter(function (d) { return (series[d[0]] || []).length; }).map(function (d) { return '<span><i style="background:' + d[2] + '"></i>' + d[1] + '</span>'; }).join('') + '</div>';
  return s;
}

      h += '<button class="btn sec2" id="si-buy">✍️ Записать цену покупки</button>';

      $('#si-sold').onclick = function () { haptic(); soldFromSteam(x); };
      $('#si-chart').onclick = function () { itemSheet(id); };
      $('#si-steam').onclick = function () { openLink('https://steamcommunity.com/market/listings/730/' + encodeURIComponent(x.name)); };
      $('#si-buy').onclick = function () { buyForm({ name: x.name, priceKop: null, platform: 'steam' }); };
      Array.prototype.forEach.call(document.querySelectorAll('.si-cost'), function (a) { a.onclick = function () { buyForm({ name: x.name, priceKop: null, platform: 'steam' }); }; });

// #8: цель продажи для предмета инвентаря Steam — «скажи, когда станет дороже X».
function saveTarget(x, kop) {
  return api('sellalert', { method: 'POST', body: { itemId: x.itemId, kop: kop } }).then(function (r) {
    x.targetKop = r.targetKop; haptic('ok'); toast(kop ? '🎯 Сообщу, когда будет ' + uah(kop) : 'Цель убрана'); targetBox(x);
  }).catch(function (e) { toast(e.message); });
}
function targetBox(x) {
  var el = $('#tgtbox'); if (!el) return;
  var base = x.priceKop || 0;
  var h = '<div class="sec">🎯 Цель продажи</div><div class="card">';
  if (x.targetKop) h += '<div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-weight:700">Сообщу, когда цена дойдёт до ' + uah(x.targetKop) + '</div>' +
    (base ? '<div class="mut" style="font-size:13px">сейчас ' + (x.live ? '' : '≈ ') + uah(base) + ' · ' + (x.targetKop > base ? 'нужно ещё +' + Math.round((x.targetKop - base) * 100 / base) + '%' : 'уже дошла — уведомление придёт при следующем обновлении цен') + '</div>' : '') + '</div>' +
    '<button class="btn danger" id="tg-del" style="width:auto;margin:0;padding:8px 12px">Убрать</button></div>';
  else {
    h += '<div class="mut" style="font-size:13px;margin-bottom:8px">Нажми — и бот пришлёт одно уведомление, когда цена в Steam станет такой или выше.</div>';
    if (base) h += '<div class="seg" id="tg-q" style="margin-bottom:8px">' + [5, 10, 20, 50].map(function (p) { return '<button data-p="' + p + '">+' + p + '%<div style="font-size:11px;opacity:.7">' + uahShort(Math.round(base * (100 + p) / 100)) + '</div></button>'; }).join('') + '</div>';
    h += '<div style="display:flex;gap:8px"><input id="tg-in" inputmode="decimal" placeholder="своя цена, ' + esc(CUR.sign) + '" style="flex:1"><button class="btn" id="tg-ok" style="width:auto;margin:0;padding:10px 16px">OK</button></div>';
  }
  h += '</div>';
  el.innerHTML = h;
  if ($('#tg-del')) $('#tg-del').onclick = function () { saveTarget(x, null); };
  Array.prototype.forEach.call(el.querySelectorAll('#tg-q button'), function (b) { b.onclick = function () { saveTarget(x, Math.round(base * (100 + +b.getAttribute('data-p')) / 100)); }; });
  if ($('#tg-ok')) $('#tg-ok').onclick = function () { var k = toKop($('#tg-in').value); if (!(k > 0)) return toast('Введи цену, например 120'); saveTarget(x, k); };
}

// Аудит, п.1 и п.5: рыночная стоимость, сумма после комиссии, себестоимость и потенциальная (не фактическая) прибыль — раздельно.
var BASIS = { listing: 'самое дешёвое объявление Steam', median24h: 'медиана продаж Steam за 24 ч', avg: 'средняя цена продаж (история, не предложение)' };
function tAgo(t) { return t ? ago(t) : '—'; }
function steamPricesHtml(p) {
  if (!p) return '';
  var a = p.avg;
  return '<details class="more"><summary><span class="chev">›</span> Цены Steam подробно</summary><div class="card">' +
    kv('Самое дешёвое объявление', p.listing ? uah(p.listing.kop) + '<div class="mut" style="font-size:12px;font-weight:400">' + tAgo(p.listing.at) + '</div>' : '<span class="mut">нет свежих данных</span>') +
    kv('Максимальный ордер покупателя', p.buyOrder ? uah(p.buyOrder.kop) + '<div class="mut" style="font-size:12px;font-weight:400">' + tAgo(p.buyOrder.at) + '</div>' : '<span class="mut">нет данных</span>') +
    kv('Медиана продаж за 24 ч', p.median24h ? uah(p.median24h.kop) + '<div class="mut" style="font-size:12px;font-weight:400">' + (p.median24h.volume != null ? p.median24h.volume + ' продаж · ' : '') + tAgo(p.median24h.at) + '</div>' : '<span class="mut">нет свежих данных</span>') +
    kv('Средняя продаж: 1 / 7 / 30 дн.', a ? [a.d1, a.d7, a.d30].map(function (v) { return v ? uahShort(v) : '—'; }).join(' / ') + '<div class="mut" style="font-size:12px;font-weight:400">история, не предложение · ' + tAgo(a.at) + '</div>' : '<span class="mut">нет свежих данных</span>') +

}
function valueCard(x) {

  var h = '<div class="card">' + kv('Рыночная стоимость', (x.basis === 'avg' ? '≈ ' : '') + uah(x.priceKop) + '<div class="mut" style="font-size:12px;font-weight:400;white-space:normal">' + esc(BASIS[x.basis] || '') + '</div>') +
    kv('На баланс после комиссии Steam', x.netKop ? uah(x.netKop) + '<div class="mut" style="font-size:12px;font-weight:400">за 1 шт. · точный расчёт Steam</div>' : '—');

// Цены на всех площадках (самое дешёвое объявление). Нажатие — открыть сайт.
function pricesBoxHtml() { return '<div id="pricebox"><div class="skel"></div></div>'; }
function loadPrices(name) {
  api('prices?name=' + encodeURIComponent(name)).then(function (r) {
    var el = $('#pricebox'); if (!el) return;
    var all = r.sites.slice();

    var min = all.length && all[0].kind !== 'reference' ? all[0].kop : null;
    var h = '<div class="sec">Цены на площадках</div><div class="card" style="padding:2px 14px">';
    var line = function (x, icon, label, price, extra) {
      return '<div class="kv" style="align-items:center;cursor:pointer" data-url="' + esc(x.url) + '"><span style="display:flex;align-items:center;gap:10px">' + icon + '<span>' + label + extra + '</span></span><span class="v" style="white-space:nowrap">' + price + '</span></div>';
    };
    var ico = function (x) { return '<span class="ic site sm' + (x.icon ? '' : ' noimg') + '"><b>' + esc(x.name.charAt(0)) + '</b>' + (x.icon ? '<img src="' + esc(x.icon) + '" alt="" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">' : '') + '</span>'; };
    if (r.steam) h += line(r.steam, '<span class="ic" style="width:26px;height:26px;border-radius:7px;font-size:15px;flex:none">🎮</span>', 'Steam Market', (r.steam.basis === 'avg' ? '≈ ' : '') + uah(r.steam.kop), '<div class="mut" style="font-size:11px">' + esc(BASIS[r.steam.basis] || '') + ' · деньги остаются в Steam</div>');
    else if (r.steamStatus === 'no_data') h += '<div class="kv"><span>🎮 Steam Market</span><span class="mut">нет актуальных данных</span></div>';

      var tags = (x.kind === 'reference' ? '<div class="mut" style="font-size:11px">ориентир площадки, не объявление</div>' : '') + (x.at ? '<div class="mut" style="font-size:11px">данные ' + ago(x.at) + (x.cur && x.cur !== 'USD' ? ' · из ' + esc(x.cur) : '') + '</div>' : '') + (x.kop === min && x.kind !== 'reference' ? '<span class="pos" style="font-size:11px;font-weight:700"> · дешевле всех</span>' : '') + (x.group === 'china' ? '<div class="mut" style="font-size:11px">Китай — нужен аккаунт на площадке</div>' : '') + (x.ref ? '<div style="font-size:11px;color:var(--amber)">партнёрская ссылка</div>' : '');
      h += line(x, ico(x), esc(x.name), '<span class="' + (x.kop === min ? 'pos' : '') + '">' + uah(x.kop) + '</span>', tags);
    });

    el.innerHTML = h;
    Array.prototype.forEach.call(el.querySelectorAll('[data-url]'), function (row) { row.onclick = function () { haptic(); openLink(row.getAttribute('data-url')); }; });

// Рекомендуемая цена выставления в Steam: растёт — чуть выше рынка, падает/ровно — на копейку ниже самого дешёвого.
function sellBoxHtml() { return '<div id="sellbox"><div class="skel"></div></div>'; }
function loadSellBox(itemId, costKop, onUse) {
  api('sellprice/' + itemId + (costKop ? '?cost=' + Math.round(costKop) : '')).then(function (r) {
    var el = $('#sellbox'); if (!el) return;
    if (!r.rec) { el.innerHTML = r.pattern ? '' : '<div class="card" style="font-size:13px"><b>💰 Нет актуальных данных</b><div class="mut">' + (r.status === 'no_data' ? 'Свежих цен Steam нет — рекомендацию по продаже не даю, чтобы не опираться на устаревшие котировки.' : 'Недостаточно данных о продажах в Steam.') + '</div></div>'; return; }
    var x = r.rec, col = x.mode === 'up' ? 'var(--green)' : x.mode === 'down' ? 'var(--amber)' : 'inherit';
    var h = '<div class="sec">💰 За сколько выставить в Steam</div><div class="card">';
    h += '<div style="font-weight:700;color:' + col + '">' + (x.mode === 'up' ? '📈 ' : x.mode === 'down' ? '📉 ' : '➖ ') + esc(x.title) + '</div>';
    h += '<div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 2px"><div class="big-num" style="font-size:26px">' + uah(x.priceKop) + '</div><div class="mut" style="font-size:13px">цена покупателя</div></div>';
    h += '<div class="mut" style="font-size:13px;margin-bottom:6px">тебе придёт ≈ ' + uah(x.receiveKop) + ' (после 15% Steam)</div>';
    if (x.quickKop !== x.priceKop) h += kv('Продать быстро', uah(x.quickKop) + '<div class="mut" style="font-size:12px;font-weight:400">придёт ≈ ' + uah(x.quickReceiveKop) + '</div>');
    h += '<div style="font-size:13px;margin-top:6px">' + esc(x.why) + '</div>';
    if (x.belowCost) h += '<div style="color:var(--amber);font-size:13px;margin-top:6px">⚠️ Это ниже твоей цены покупки. Без убытка — от ' + uah(x.breakEvenKop) + '.</div>';
    h += '<div class="mut" style="font-size:12px;margin-top:6px">' + (x.basis === 'live' ? 'По самому дешёвому лоту Steam (' + ago(r.liveAt) + ') и продажам за сутки/неделю.' : 'Живой цены Steam сейчас нет — по средним продажам за сутки и неделю.') +
      (CUR.code !== 'UAH' ? ' Если кошелёк Steam в другой валюте, Steam покажет свою сумму — ориентируйся на «чуть выше / ниже рынка».' : '') + '</div>';
    h += '<div style="margin-top:6px"><a id="sb-calc" style="font-size:13px;color:var(--link);cursor:pointer">🧮 А сколько придёт на других площадках?</a></div>';
    if (onUse) h += '<button class="btn sec2" id="sb-use" style="margin-top:8px">🎯 Уведомить, когда цена дойдёт до ' + uah(x.priceKop) + '</button>';
    h += '</div>';
    el.innerHTML = h;
    if (onUse && $('#sb-use')) $('#sb-use').onclick = function () { onUse(x.priceKop); };
    if ($('#sb-calc')) $('#sb-calc').onclick = function () { calcSheet(x.priceKop); };
  }).catch(function () { var el = $('#sellbox'); if (el) el.innerHTML = ''; });
}

// Подробности экземпляров: float, паттерн, фаза Doppler, наклейки и брелки (из открытых данных Steam).
function assetDetails(x) {
  var ds = x.details || [];
  var h = '';
  if (x.pattern) h += '<div class="card" style="color:var(--amber);font-size:14px">⚠️ Цена этого скина сильно зависит от паттерна (номер ниже). Для редких паттернов (blue gem, Fade 100%, красивые сетки и т.п.) реальная цена может быть намного выше — бот показывает обычную цену по названию.</div>';
  if (!ds.length) return h;
  h += '<div class="sec">' + (ds.length > 1 ? 'Твои экземпляры (' + ds.length + ')' : 'Твой экземпляр') + '</div>';
  ds.forEach(function (a, i) {
    var rows = '';
    if (a.float != null) rows += kv('Float', a.float.toFixed(a.float < 0.01 ? 6 : 4) + (a.floatNote ? '<div style="font-size:12px;font-weight:400;color:var(--amber);white-space:normal">' + esc(a.floatNote) + '</div>' : ''));
    if (a.seed != null) rows += kv('Паттерн', '#' + a.seed);
    if (a.phase) rows += kv('Фаза', esc(a.phase) + (a.phaseKop ? '<div style="font-size:12px;font-weight:400" class="mut">на сайтах от ≈ ' + uahShort(a.phaseKop) + '</div>' : ''));
    a.stickers.forEach(function (st) { rows += kv('🏷️ ' + esc(st.name.replace(/^Sticker \| /, '')), (st.kop ? '≈ ' + uahShort(st.kop) : '—') + (st.wear > 0.05 ? '<div style="font-size:12px;font-weight:400" class="mut">потёрта ' + Math.round(st.wear * 100) + '%</div>' : '')); });
    a.charms.forEach(function (c) { rows += kv('🔗 ' + esc(c.name.replace(/^Charm \| /, '')), (c.kop ? '≈ ' + uahShort(c.kop) : '—') + (c.pattern != null ? '<div style="font-size:12px;font-weight:400" class="mut">шаблон #' + c.pattern + '</div>' : '')); });
    if (a.stickersKop) rows += kv('Наклейки и брелки вместе', '≈ ' + uahShort(a.stickersKop) + '<div class="mut" style="font-size:12px;font-weight:400;white-space:normal">цены отдельных наклеек; к цене предмета не прибавляется — нет подтверждённых продаж с ними</div>');
    h += '<div class="card">' + (ds.length > 1 ? '<div class="mut" style="font-size:12px;margin-bottom:4px">#' + (i + 1) + '</div>' : '') + (rows || '<span class="mut">Нет данных</span>') + '</div>';
  });
  if (ds.some(function (a) { return a.stickers.length || a.charms.length; })) h += '<div class="note">Цена наклеек — отдельно, по их средней цене в Steam. К цене скина они обычно добавляют немного (часто 0–10% своей стоимости); дорогие и редкие — больше. Потёртые наклейки ценятся меньше.</div>';
  if (ds.some(function (a) { return a.phase; })) h += '<div class="note">Цена фазы — самое дешёвое объявление этой фазы на CSFloat (открытый прайс). В Steam у Doppler одна цена на все фазы, поэтому для Ruby/Sapphire/Black Pearl/Emerald она сильно занижена.</div>';
  return h;
}

// ---------- «Купил?» после возврата с сайта ----------
function askBought() {
  var p = state.pendingBuy; state.pendingBuy = null;
  if (!p || Date.now() - p.at > 30 * 60 * 1000) return;
  var h = '<h2>Купил?</h2><div class="sub">' + esc(p.name) + ' на ' + esc(p.where) + (p.priceKop ? ' за ~' + uah(p.priceKop) : '') + '</div>' +
    '<div class="note">Если купил — запиши, и бот подскажет, когда продавать, и посчитает реальную прибыль.</div>' +
    '<button class="btn" id="ab-yes">✅ Да, записать</button><button class="btn sec2" id="ab-no">Нет, не купил</button>';
  sheet(h);
  $('#ab-yes').onclick = function () { buyForm({ name: p.name, priceKop: p.priceKop, platform: p.platform, signalId: p.signalId }); };
  $('#ab-no').onclick = closeSheet;
}
function onBack() {
  if (document.visibilityState && document.visibilityState !== 'visible') return;
  if (state.pendingBuy && Date.now() - state.pendingBuy.at > 3000) setTimeout(askBought, 300);
  if (state.steamWait) { state.steamWait = false; if (state.tab === 'inv') setTimeout(inventory, 300); }
}
document.addEventListener('visibilitychange', onBack);
if (tg && tg.onEvent) { try { tg.onEvent('activated', onBack); } catch (e) {} }
function goBuy(p) { state.pendingBuy = { name: p.name, where: p.where, priceKop: p.priceKop, platform: p.platform, signalId: p.signalId || null, at: Date.now() }; openLink(p.url); }

function platformOptions(sel, noGift) {
  var p = state.cache.platforms || [{ v: 'steam', t: 'Steam Market' }, { v: 'skinport', t: 'Skinport' }, { v: 'csfloat', t: 'CSFloat' }, { v: 'other', t: 'Другая площадка' }, { v: 'gift', t: 'Получено бесплатно' }];
  return p.filter(function (x) { return !(noGift && x.v === 'gift'); }).map(function (x) { return '<option value="' + x.v + '"' + (x.v === sel ? ' selected' : '') + '>' + esc(x.t) + '</option>'; }).join('');
}
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function toKop(v) { v = String(v || '').replace(/[^\d,.]/g, '').replace(',', '.'); if (v === '') return null; var n = parseFloat(v); return isNaN(n) ? NaN : Math.round(n * 100 * CUR.per); }
function buyForm(pre) {
  var h = '<h2>Записать покупку</h2><div class="sub">Бот ничего не покупает сам — это учёт твоих реальных сделок.</div>';
  h += pre.name ? '<div class="card" style="font-weight:600">' + esc(pre.name) + '</div>' : '<label class="f"><span>Предмет</span><input id="bq" placeholder="🔍 Название — можно по-русски: «ак красная линия»" autocomplete="off"></label><div id="bsr"></div><div class="card" id="bname" style="display:none;font-weight:600"></div>';
  h += '<div class="grid2" style="margin-top:10px"><label class="f" style="margin:0"><span>Количество</span><input id="bqty" inputmode="numeric" value="1"></label><label class="f" style="margin:0"><span>Цена за 1 шт., ' + CUR.sign + '</span><input id="bpr" inputmode="decimal" value="' + (pre.priceKop != null ? units(pre.priceKop) : '') + '" placeholder="0 — бесплатно"></label></div>';
  h += '<label class="f"><span>Где куплено</span><select id="bpl">' + platformOptions(pre.platform || 'skinport') + '</select></label>';
  h += '<div class="grid2"><label class="f" style="margin:10px 0 0"><span>Комиссии всего, ' + CUR.sign + '</span><input id="bfee" inputmode="decimal" placeholder="0"></label><label class="f" style="margin:10px 0 0"><span>Дата</span><input id="bdt" type="date" value="' + today() + '" max="' + today() + '"></label></div>';
  h += '<button class="btn" id="bsave">Сохранить</button>';

    api('calc?kop=' + k + '&mode=' + mode).then(function (r) {
      var best = r.rows.filter(function (x) { return x.wallet === 'cash'; })[0];
      var out = '<div class="card" style="padding:2px 14px">' + r.rows.map(function (x) {
        var main = mode === 'sell' ? uah(x.getKop) : uah(x.listKop);
        var sub = (mode === 'sell' ? 'придёт' : 'выставить за') + ' · комиссия ' + esc(x.feeText) + (x.note ? ' · ' + esc(x.note) : '');
        return '<div class="kv" style="align-items:center"><span style="display:flex;align-items:center;gap:10px"><span class="ic site sm' + (x.icon ? '' : ' noimg') + '"><b>' + esc(x.name.charAt(0)) + '</b>' + (x.icon ? '<img src="' + esc(x.icon) + '" alt="" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">' : '') + '</span><span>' + esc(x.name) +
          '<div class="mut" style="font-size:11px;font-weight:400">' + sub + '</div></span></span><span class="v' + (x === best ? ' pos' : '') + '" style="white-space:nowrap;font-weight:700">' + main + '</span></div>';
      }).join('') + '</div>';
      out += '<div class="note">' + (mode === 'sell' ? 'Сверху — где придёт больше всего.' : 'Сверху — где можно выставить дешевле всех и всё равно получить свою сумму.') +
        ' Steam — точный расчёт (5% Steam + 10% CS2), но деньги остаются на балансе Steam. Комиссии сайтов — по открытым данным, перед продажей проверь на сайте.' +
        (r.withdrawBp ? '' : ' Комиссию банка/крипты при выводе можно задать в Ещё → Настройки.') + '</div>';
      $('#cr').innerHTML = out;
    }).catch(function (e) { $('#cr').innerHTML = '<div class="note">⚠️ ' + esc(e.message) + '</div>'; });
  };
  $('#ck').oninput = function () { clearTimeout(timer); timer = setTimeout(run, 350); };
  Array.prototype.forEach.call(document.querySelectorAll('#cm button'), function (b) {
    b.onclick = function () { mode = b.getAttribute('data-m'); Array.prototype.forEach.call(document.querySelectorAll('#cm button'), function (x) { x.classList.toggle('on', x === b); }); haptic(); run(); };
  });
  if (preKop) run(); else setTimeout(function () { try { $('#ck').focus(); } catch (e) {} }, 300);
}
// ---------- Обратная связь и поддержка ----------
function reportLink() { return '<div style="text-align:center;margin:14px 0 4px"><a id="rep" class="mut" style="font-size:14px;cursor:pointer">⚠️ Цена неверная? Сообщить об ошибке</a></div>'; }
var REASONS = [['price', 'Цена неверная'], ['gone', 'Предмета уже нет / купили'], ['link', 'Ссылка не работает'], ['idea', 'Рекомендация странная'], ['other', 'Другое']];
function reportSheet(name, context) {
  var h = '<h2>Сообщить об ошибке</h2><div class="sub">' + (name ? esc(name) : 'Что-то работает не так') + '</div>';
  h += '<div class="seg" id="rs" style="flex-wrap:wrap">' + REASONS.map(function (x, i) { return '<button data-r="' + x[0] + '" class="' + (i === 0 && name ? 'on' : '') + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
  h += '<label class="f"><span>Комментарий (необязательно)</span><textarea id="rc" rows="3" maxlength="500" placeholder="например: на сайте цена 2.10 $, а тут 1.80 $" style="width:100%;resize:vertical"></textarea></label>';
  h += '<button class="btn" id="rsend">Отправить</button><div class="note">Сообщение увидит только владелец бота вместе с твоим Telegram ID — чтобы при необходимости ответить.</div>';
  sheet(h);
  var reason = name ? 'price' : null;
  Array.prototype.forEach.call(document.querySelectorAll('#rs button'), function (b) {
    b.onclick = function () { reason = b.getAttribute('data-r'); Array.prototype.forEach.call(document.querySelectorAll('#rs button'), function (x) { x.classList.toggle('on', x === b); }); };
  });
  $('#rsend').onclick = function () {
    if (!reason) return toast('Выбери, что не так');
    $('#rsend').disabled = true;
    api('feedback', { method: 'POST', body: { item: name, reason: reason, comment: $('#rc').value, context: context } })
      .then(function () { haptic('ok'); closeSheet(); toast('Спасибо! Передал владельцу'); })
      .catch(function (e) { $('#rsend').disabled = false; toast(e.message); });
  };
}
function suggestSheet() {
  var h = '<h2>💡 Предложка канала</h2><div class="sub">Что стоит опубликовать: новость, находку на рынке, идею, полезный совет. Владелец посмотрит и решит. Публикуется без имени — «от подписчика».</div>';
  h += '<label class="f"><span>Текст</span><textarea id="sgt" rows="5" maxlength="900" placeholder="например: на Skinport сейчас скидки на кейсы Kilowatt" style="width:100%;resize:vertical"></textarea></label>';
  h += '<button class="btn" id="sgs">Отправить</button><div class="note">Картинку можно прислать в чате с ботом: команда /suggest. Ссылки на сторонние сайты и реклама не публикуются. До 3 предложений в сутки.</div>';
  sheet(h);
  $('#sgs').onclick = function () {
    var t = $('#sgt').value.trim();
    if (t.length < 10) return toast('Слишком коротко — опиши хотя бы парой предложений');
    $('#sgs').disabled = true;
    api('suggest', { method: 'POST', body: { text: t } })
      .then(function () { haptic('ok'); closeSheet(); toast('Спасибо! Если опубликуем — бот напишет'); })
      .catch(function (e) { $('#sgs').disabled = false; toast(e.message); });
  };
}
function donateSheet() {
  var h = '<h2>💛 Поддержать Ценолова</h2><div class="sub">Бот бесплатный и работает круглосуточно. Если он помог — можно отправить звёзды Telegram. Это добровольно и ничего не открывает: бот остаётся бесплатным для всех.<br><br>Поддержавшие попадают во вторую бегущую строку «💛 Топ поддержки» — с именем из Telegram. Скрыть себя: /donate в боте → «Скрыть меня».</div>';
  h += '<div class="grid2" id="dons">' + [25, 50, 100, 250, 500].map(function (n) { return '<button class="btn sec2" data-n="' + n + '" style="margin:0">⭐ ' + n + '</button>'; }).join('') + '</div>';
  h += '<div class="note">Оплата проходит внутри Telegram. Вопросы по оплате — команда /paysupport в боте.</div>';
  sheet(h);
  Array.prototype.forEach.call(document.querySelectorAll('#dons button'), function (b) {
    b.onclick = function () {
      var n = +b.getAttribute('data-n');
      api('donate', { method: 'POST', body: { stars: n } }).then(function (r) {
        if (tg && tg.openInvoice) tg.openInvoice(r.link, function (st) { if (st === 'paid') { haptic('ok'); closeSheet(); toast('Спасибо за поддержку! 💛'); setTimeout(refreshTicker, 4000); } });
        else openLink(r.link);
      }).catch(function (e) { toast(e.message); });
    };
  });
}
function more() {
  view.innerHTML = (state.isAdmin ? '<div class="row" id="m-own"><div class="ic">🛠</div><div class="m"><div class="n">Панель владельца</div><div class="d">Пользователи, Steam и домашний агент, проверка разгона, донаты, ошибки</div></div><div class="mut">›</div></div>' : '') +
    '<div class="row" id="m-set"><div class="ic">⚙️</div><div class="m"><div class="n">Настройки</div><div class="d">Пороги прибыли, бюджет, уведомления, тихие часы</div></div><div class="mut">›</div></div>' +
    (state.isAdmin ? '<div class="row" id="m-st"><div class="ic">🩺</div><div class="m"><div class="n">Состояние системы</div><div class="d">Источники, сборщик, курсы, ошибки</div></div><div class="mut">›</div></div>' : '') +
    '<div class="row" id="m-f"><div class="ic">⏱</div><div class="m"><div class="n">Как часто обновляется</div><div class="d">Цены, рекомендации, уведомления, тихие часы</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-pv"><div class="ic">🛡</div><div class="m"><div class="n">Что знает бот</div><div class="d">Что нужно для работы, какие данные видит, чего не получает никогда</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-tm"><div class="ic">📄</div><div class="m"><div class="n">Условия и риски</div><div class="d">Бот — сборник информации, сделки на свой риск</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-calc"><div class="ic">🧮</div><div class="m"><div class="n">Калькулятор комиссий</div><div class="d">Сколько придёт после продажи на каждой площадке — и за сколько выставить</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-don"><div class="ic">💛</div><div class="m"><div class="n">Поддержать проект</div><div class="d">Звёздами Telegram — добровольно, бот остаётся бесплатным</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-sug"><div class="ic">💡</div><div class="m"><div class="n">Предложить пост в канал</div><div class="d">Новость, находка на рынке, идея — владелец решит, публиковать ли</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-rep"><div class="ic">📮</div><div class="m"><div class="n">Сообщить об ошибке</div><div class="d">Неверная цена, битая ссылка, идея — уйдёт владельцу</div></div><div class="mut">›</div></div>' +
    '<div class="row" id="m-h"><div class="ic">🧾</div><div class="m"><div class="n">История сделок</div><div class="d">Реальный результат по кошелькам</div></div><div class="mut">›</div></div>' +
    '<div class="note" style="margin-top:14px">Бот анализирует рынок и ничего не покупает сам. Суммы — в твоей валюте (меняется в настройках), пересчёт по курсу НБУ.</div>';
  if ($('#m-own')) $('#m-own').onclick = function () { haptic(); ownerPanel(); };
  $('#m-don').onclick = donateSheet; $('#m-calc').onclick = function () { calcSheet(); }; $('#m-rep').onclick = function () { reportSheet(null, 'раздел «Ещё»'); }; $('#m-sug').onclick = suggestSheet;
  $('#m-set').onclick = settings; if ($('#m-st')) $('#m-st').onclick = status; $('#m-h').onclick = history; $('#m-pv').onclick = privacy; $('#m-tm').onclick = termsSheet;
  $('#m-f').onclick = function () { api('summary').then(function (s) { howOften(s.notify); }).catch(function (e) { toast(e.message); }); };
}
function settings() {
  sheet('<div class="skel"></div><div class="skel"></div><div class="skel"></div>');
  api('settings').then(function (r) {
    var h = '<h2>Настройки</h2><div class="sub">Сохраняются сразу. Суммы — в ' + esc(CUR.code) + '.</div>';
    var groups = [['Сделки', ['budget_kop', 'max_buy_kop', 'min_profit_kop', 'min_roi_bp', 'min_liquidity']], ['Комиссии при оплате и выводе', ['deposit_fee_bp', 'withdraw_fee_bp']], ['Уведомления', ['notify_enabled', 'notify_recs', 'recs_per_day', 'min_priority', 'max_per_hour', 'quiet_start', 'quiet_end', 'sig_arbitrage', 'sig_change', 'sig_target', 'sig_inventory', 'change_threshold_bp']], ['Сводка и данные', ['weekly_report', 'daily_report', 'daily_hour', 'max_stale_min', 'src_steam', 'src_skinport', 'src_csfloat']]];
    var by = {}; r.settings.forEach(function (s) { by[s.key] = s; });
    if (r.currencies && r.currencies.length) {
      h += '<div class="sec">Валюта</div><div class="card" style="padding:4px 14px"><div class="kv" style="align-items:center"><span>Показывать цены в<div class="mut" style="font-size:12px">Пересчёт по курсу НБУ (RUB, BRL, ARS — через доллар). В Steam цена в твоём кошельке может немного отличаться.</div></span><select id="curSel" style="width:auto;max-width:46%;padding:7px 10px">' +
        r.currencies.map(function (c) { return '<option value="' + c.code + '"' + (c.code === CUR.code ? ' selected' : '') + '>' + esc(c.code + ' ' + c.sign + ' · ' + c.name) + '</option>'; }).join('') + '</select></div></div>';
    }
    groups.forEach(function (g) {
      h += '<div class="sec">' + g[0] + '</div><div class="card" style="padding:4px 14px">';
      g[1].forEach(function (k) {
        var s = by[k]; if (!s) return;
        if (s.kind === 'toggle') h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + '</span><label class="sw"><input type="checkbox" data-k="' + k + '"' + (s.value === '1' ? ' checked' : '') + '><b></b></label></div>';
        else if (s.kind === 'choice') h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + '</span><select data-k="' + k + '" style="width:auto;padding:7px 10px">' + s.choices.map(function (c) { return '<option value="' + c.v + '"' + (c.v === s.value ? ' selected' : '') + '>' + esc(c.t) + '</option>'; }).join('') + '</select></div>';
        else {
          var raw = s.kind === 'uah' ? units(Number(s.value)) : s.kind === 'percent' ? (Number(s.value) / 100).toString().replace('.', ',') : s.value;
          h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + (s.hint ? '<div class="mut" style="font-size:12px">' + esc(s.hint) + '</div>' : '') + '</span><input data-k="' + k + '" inputmode="decimal" value="' + esc(raw) + '" style="width:96px;text-align:right;padding:8px 10px">' + '</div>';
        }
      });
      h += '</div>';
    });
    $('#sc').innerHTML = h;
    if ($('#curSel')) $('#curSel').onchange = function () {
      api('settings', { method: 'POST', body: { key: 'currency', value: $('#curSel').value } }).then(function () {
        haptic('ok'); toast('Валюта: ' + CUR.code); state.cache = {}; go(state.tab); settings();
      }).catch(function (e) { toast(e.message); });
    };
    Array.prototype.forEach.call($('#sc').querySelectorAll('[data-k]'), function (el) {
      var k = el.getAttribute('data-k');
      var save = function () {
        var val = el.type === 'checkbox' ? el.checked : el.value;
        api('settings', { method: 'POST', body: { key: k, value: val } }).then(function () { haptic('ok'); toast('Сохранено'); }).catch(function (e) { toast(e.message); });
      };
      if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.onchange = save; else el.onchange = save;
    });
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; });
}
function status() {
  sheet('<div class="skel"></div><div class="skel"></div>');
  api('status').then(function (r) {
    var h = '<h2>Состояние системы</h2><div class="sub">' + (r.collector ? 'Steam и Skinport опрашивает сборщик GitHub Actions' : '') + '</div>';
    h += '<div class="card">' + r.sources.map(function (s) {
      return '<div class="kv"><span class="k">' + (SRC[s.source] || esc(s.source)) + (s.status !== 'ok' && (s.error || s.disabled) ? '<div style="font-size:12px;color:var(--hint)">' + esc(s.disabled || s.error) + '</div>' : '') + '</span><span class="v">' + srcStatus(s) + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="sec">Курсы НБУ</div><div class="card">' + (r.fx.length ? r.fx.map(function (f) { return kv('1 ' + f.base, f.rate.toFixed(4).replace('.', ',') + ' ₴ <span class="mut">(' + f.date + ')</span>'); }).join('') : '<span class="mut">ещё не загружены</span>') + '</div>';
    h += '<div class="sec">Задачи</div><div class="card">' + r.jobs.map(function (j) { return kv(esc(j.name), j.enabled ? (j.fails ? '⚠️ ошибок: ' + j.fails : '✅') : '⏸ выключена'); }).join('') + '</div>';
    if (r.jobs.some(function (j) { return !j.enabled; })) h += '<button class="btn sec2" id="jen">Включить отключённые задачи</button>';
    h += '<div class="sec">Сегодня</div><div class="card">' + kv('Снимков цен', r.counters.snapshots || 0) + kv('Уведомлений', r.counters.notifications || 0) + kv('Каталог для поиска', r.catalog.count ? r.catalog.count.toLocaleString('ru-RU') + ' названий' : 'ещё не загружен') + '</div>';
    if (r.errors.length) h += '<div class="sec">Последние ошибки</div><div class="card">' + r.errors.map(function (e) { return '<div class="kv"><span class="k">' + ago(e.at) + ' · ' + esc(e.source || '') + '</span><span class="v" style="font-size:13px;font-weight:400">' + esc(e.message.slice(0, 90)) + '</span></div>'; }).join('') + '</div>';
    $('#sc').innerHTML = h;
    if ($('#jen')) $('#jen').onclick = function () { api('jobs/enable', { method: 'POST' }).then(function () { toast('Включено'); status(); }); };
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; });
}

if (!INIT) { view.innerHTML = '<div class="empty"><div class="e">🔒</div>Открой приложение из своего бота в Telegram — кнопкой «Приложение» рядом с полем ввода.</div>'; return; }
var start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
var hashTab = (location.hash || '').replace('#', '');
var first = ['deals', 'market', 'inv', 'more', 'rally'].indexOf(start) >= 0 ? start : ['deals', 'market', 'inv', 'more', 'rally'].indexOf(hashTab) >= 0 ? hashTab : 'home';
// Сначала — согласие с условиями (один раз). Без ответа сервера не блокируем: бот всё равно спросит в чате.
loading(3);
api('terms').then(function (t) { if (t.accepted && !t.onboarded) onboarding(first); else if (t.accepted) { go(first); if (first !== 'home') refreshTicker(); } else termsGate(t, first); }).catch(function () { go(first); });
})();
