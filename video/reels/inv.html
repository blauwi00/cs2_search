<!doctype html>
<!-- Ролик «Сколько стоят твои скины»: смесь трёх образцов владельца (плашка-крючок, жёлтое слово, карточки как в рекламе Wise).
     Данные — work/vdata.js (живые цены Steam, vfetch.py + vdata.ts). Кадр задаёт window.frameAt(t); рендер: ../cinema/render.mjs -->
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#04100B}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0}
.hook{position:absolute;left:80px;right:80px;top:226px;height:200px;background:#fff;border-radius:30px;color:#0A0A0A;z-index:50;
  font-weight:800;font-size:72px;line-height:1.06;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 26px;letter-spacing:-1.5px;
  box-shadow:0 20px 60px rgba(0,0,0,.45)}
.nick{position:absolute;left:0;right:0;top:446px;text-align:center;font-weight:700;font-size:68px;opacity:.8;letter-spacing:-.5px;z-index:50}
.word{position:absolute;left:40px;right:40px;top:1330px;height:130px;text-align:center;font-weight:900;font-size:124px;line-height:130px;z-index:60;
  color:#FFD23F;text-shadow:0 0 30px rgba(255,210,63,.6),0 6px 0 rgba(0,0,0,.35);letter-spacing:1px}
/* Сцена 1: огромный скин со светом его цвета */
#hero{position:absolute;inset:0}
#halo{position:absolute;left:-200px;top:400px;width:1480px;height:1100px;border-radius:50%;filter:blur(90px);opacity:.75}
#heroimg{position:absolute;left:40px;top:600px;width:1000px;height:680px;object-fit:contain;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
#streak{position:absolute;left:-400px;top:0;width:260px;height:1920px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);mix-blend-mode:screen}
/* Сцена 2: карточки в перспективе */
#stage{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 40%}
#deck{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
.card{position:absolute;left:70px;width:830px;height:200px;border-radius:34px;transform-style:preserve-3d;
  background:linear-gradient(135deg,rgba(120,230,170,.30),rgba(30,90,62,.55) 45%,rgba(8,40,27,.85));
  border:2px solid rgba(190,255,215,.35);box-shadow:0 40px 60px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.25)}
.card .clip{position:absolute;inset:0;border-radius:34px;overflow:hidden}.card .gl{position:absolute;right:-60px;top:-80px;width:420px;height:360px;border-radius:50%;filter:blur(60px);opacity:.7}
.card img{position:absolute;left:10px;top:-40px;width:400px;max-height:290px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}
.card .p{position:absolute;right:40px;top:44px;font-weight:900;font-size:110px;letter-spacing:-3px;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.card .n{position:absolute;right:40px;bottom:26px;font-weight:700;font-size:68px;letter-spacing:-1.5px;opacity:.92;white-space:nowrap}
#line{position:absolute;width:10px;height:1100px;left:948px;top:500px;border-radius:5px;background:linear-gradient(#b8ffcf,#41e08a);box-shadow:0 0 30px #41e08a,0 0 80px #41e08a;opacity:0}
/* Сцена 3: итог на стеклянной плите */
#tot{position:absolute;inset:0;perspective:1600px}
#plate{position:absolute;left:50px;width:980px;top:580px;height:700px;border-radius:44px;transform-style:preserve-3d;
  background:linear-gradient(140deg,rgba(130,240,180,.28),rgba(20,70,48,.7) 50%,rgba(6,30,20,.9));border:2px solid rgba(190,255,215,.35);
  box-shadow:0 60px 120px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.25);text-align:center;overflow:hidden}
#plate .big{display:inline-block;margin-top:50px;font-weight:900;font-size:200px;line-height:1;color:#FFD23F;text-shadow:0 0 50px rgba(255,210,63,.55);letter-spacing:-7px;white-space:nowrap}
#plate .l{font-weight:700;font-size:68px;line-height:1.12;margin-top:40px;letter-spacing:-1px}
#plate .m{font-weight:600;font-size:68px;line-height:1.12;margin-top:34px;opacity:.7;letter-spacing:-1px}
#plate .sh{position:absolute;top:-100px;width:200px;height:900px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(18deg)}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;z-index:70}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="hero"><div id="halo"></div><img id="heroimg"><div id="streak"></div></div>
<div id="stage"><div id="deck"></div><div id="line"></div></div>
<div id="tot"><div id="plate"><div class="sh" id="psh"></div><div class="big" id="big"></div><div class="l" id="netl"></div><div class="m" id="note"></div></div></div>
<div class="hook" id="hook"></div>
<div class="nick" id="nick">@cenolow_bot</div>
<div class="word" id="word"></div>
<canvas id="grain" width="540" height="960" style="width:1080px;height:1920px"></canvas>
<script src="work/vdata.js"></script>
<script>
var V = window.V, $ = function (id) { return document.getElementById(id); };
var usd = function (c) { return '$' + (c / 100).toFixed(2); };
var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
var ease = function (x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
var inout = function (x) { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
var back = function (x) { x = clamp(x, 0, 1); var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// Крючок из настоящих чисел: сколько стоит пример в Steam и сколько придёт после комиссии.
$('hook').innerHTML = 'Скинов на $' + Math.floor(V.total / 100) + ',<br>а на руки $' + Math.floor(V.net / 100) + '?';

// Цвет света скина (vfetch.py): усиливаем до яркого; почти серым скинам — фирменный зелёный.
var rgba = function (c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; };
function vivid(c) {
  var mx = Math.max(c[0], c[1], c[2]), mn = Math.min(c[0], c[1], c[2]);
  if (mx - mn < 25) return [65, 224, 138];
  return c.map(function (v) { return 255 * Math.pow((v - mn) / (mx - mn), 1.4) * 0.85 + 30; });
}
var tints = {}; V.items.forEach(function (it) { tints['work/' + it.img] = vivid(it.tint); });

// Фон: глубокий зелёный, мягкий плывущий свет, виньетка, тонкая «топография».
var bg = $('bg').getContext('2d');
var centers = [[180, 380, 1.3], [900, 860, 2.1], [300, 1500, 0.7], [960, 1750, 2.9], [560, 1100, 4.2]];
function drawBg(t) {
  bg.fillStyle = '#04100B'; bg.fillRect(0, 0, 1080, 1920);
  var lx = 540 + 220 * Math.sin(t * 0.5), ly = 900 + 180 * Math.cos(t * 0.37);
  var g = bg.createRadialGradient(lx, ly, 0, lx, ly, 1100); g.addColorStop(0, 'rgba(40,140,90,.55)'); g.addColorStop(.5, 'rgba(14,60,40,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  bg.fillStyle = g; bg.fillRect(0, 0, 1080, 1920);
  bg.strokeStyle = 'rgba(80,170,125,.13)'; bg.lineWidth = 2;
  var dy = (t * 15) % 1920;
  for (var c = 0; c < centers.length; c++) for (var pass = 0; pass < 2; pass++) {
    var cx = centers[c][0], cy = centers[c][1] - dy + pass * 1920, ph = centers[c][2];
    for (var k = 1; k <= 14; k++) {
      bg.beginPath();
      for (var a = 0; a <= 64; a++) {
        var th = a / 64 * Math.PI * 2, r = k * 34 + 14 * Math.sin(3 * th + ph + k * 0.35 + t * 0.4) + 9 * Math.sin(5 * th - ph * 1.7 + k * 0.2);
        var x = cx + r * Math.cos(th) * 1.15, y = cy + r * Math.sin(th); if (a === 0) bg.moveTo(x, y); else bg.lineTo(x, y);
      }
      bg.stroke();
    }
  }
  var v = bg.createRadialGradient(540, 960, 500, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)');
  bg.fillStyle = v; bg.fillRect(0, 0, 1080, 1920);
}
// Зерно плёнки — детерминированное от номера кадра.
var gr = $('grain').getContext('2d'), gimg = gr.createImageData(540, 960);
function drawGrain(t) {
  var s = (Math.floor(t * 30) * 2654435761) >>> 0, d = gimg.data;
  for (var i = 0; i < d.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; var v = s >>> 24; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gr.putImageData(gimg, 0, 0);
}

var WORDS = [[0, 'СКИНЫ'], [1.5, 'ОТКРЫВАЕМ'], [2.5, 'ВХОДИМ'], [3.5, 'БЕЗ ПАРОЛЯ'], [4.5, 'ИНВЕНТАРЬ'], [6, 'ЦЕНА'], [7, 'СЕГОДНЯ'],
  [8, 'СЧИТАЕМ'], [11.5, 'ИТОГО'], [14, 'УВЕДОМИТ'], [16, 'БЕСПЛАТНО']];
function word(t) {
  var w = WORDS[0]; for (var i = 0; i < WORDS.length; i++) if (t >= WORDS[i][0]) w = WORDS[i];
  $('word').textContent = w[1];
  $('word').style.transform = 'scale(' + (1 + 0.28 * (1 - clamp((t - w[0]) / 0.1, 0, 1))) + ')';
}

// Сцена 1 (0–1,5 с): три крупных скина со светом своего цвета, смена на долю такта с ударом и бликом.
var HERO = [V.items[1], V.items[0], V.items[2]];
function drawHero(t) {
  var on = t < 1.5; $('hero').style.display = on ? 'block' : 'none'; if (!on) return;
  var i = Math.min(2, Math.floor(t / 0.5)), l = t - i * 0.5, src = 'work/' + HERO[i].img, im = $('heroimg');
  if (im.getAttribute('src') !== src) im.src = src;
  var c = tints[src] || [65, 224, 138];
  $('halo').style.background = 'radial-gradient(' + rgba(c, .9) + ',' + rgba(c, .25) + ' 45%,transparent 70%)';
  var punch = 1 - ease(l / 0.18);
  im.style.transform = 'rotate(' + (-9 + l * 4) + 'deg) scale(' + (1.02 + 0.22 * punch + l * 0.06) + ')';
  im.style.filter = 'drop-shadow(0 40px 50px rgba(0,0,0,.6)) blur(' + (punch * 6).toFixed(1) + 'px)';
  $('streak').style.left = (-400 + ease(l / 0.4) * 1900) + 'px';
}

// Сцена 2 (8–11,5 с): ряды карточек в наклоне, как «Paid» у Wise; новая въезжает справа, вдоль края бежит световая линия.
var deck = $('deck');
var cards = V.items.map(function (it) {
  var d = document.createElement('div'); d.className = 'card';
  d.innerHTML = '<div class="clip"><div class="gl"></div></div><img src="work/' + it.img + '"><div class="p">' + usd(it.cents) + '</div>';
  deck.appendChild(d); return d;
});
var C0 = 8.0, CSTEP = 0.48;
function drawCards(t) {
  var on = t >= C0 && t < 11.9; $('stage').style.display = on ? 'block' : 'none'; if (!on) return;
  var k = (t - C0) / 3.5, collapse = ease((t - 11.5) / 0.4);
  // Камера: медленный наезд и доворот всей колоды.
  var n = clamp((t - C0) / CSTEP, 0, cards.length - 1), scroll = Math.max(0, n - 1.6) * 215;
  deck.style.transform = 'translateY(' + (60 - scroll) + 'px) rotateX(' + (24 - k * 6) + 'deg) rotateZ(' + (-7 + k * 3) + 'deg) scale(' + (0.98 + k * 0.05) + ')';
  for (var i = 0; i < cards.length; i++) {
    var d = cards[i], src = 'work/' + V.items[i].img, c = tints[src] || [65, 224, 138];
    d.querySelector('.gl').style.background = rgba(c, .9);
    var p = (t - C0 - i * CSTEP) / 0.4;
    if (p < 0) { d.style.opacity = 0; continue; }
    var e = back(p), y = 600 + i * 215, sy = y + 60 - scroll;
    d.style.top = y + 'px'; d.style.zIndex = 10 + i;
    d.style.transform = 'translateX(' + ((1 - e) * 1100) + 'px) translateZ(' + (collapse * -600) + 'px)';
    d.style.filter = 'blur(' + ((1 - ease(p)) * 10).toFixed(1) + 'px)';
    d.style.opacity = (1 - collapse) * clamp((sy - 480) / 160, 0, 1);
  }
  var lp = (t - C0) / 3.0; $('line').style.opacity = clamp(Math.sin(clamp(lp, 0, 1) * Math.PI) * 1.4, 0, 1) * (1 - collapse);
  $('line').style.transform = 'rotateZ(' + (-7 + k * 3) + 'deg) scaleY(' + ease(lp * 1.5) + ')'; $('line').style.transformOrigin = '50% 0';
}

// Сцена 3 (11,5–14 с): итог считается на стеклянной плите, плита чуть повёрнута и доворачивается к зрителю.
function drawTotal(t) {
  var on = t >= 11.5 && t < 14; $('tot').style.display = on ? 'block' : 'none'; if (!on) return;
  var k = (t - 11.5) / 2.5, a = back((t - 11.5) / 0.45);
  $('plate').style.transform = 'translateY(' + ((1 - a) * 300) + 'px) rotateX(' + (14 - k * 10) + 'deg) rotateY(' + (-12 + k * 9) + 'deg)';
  $('plate').style.opacity = clamp((t - 11.5) / 0.15, 0, 1);
  $('big').innerHTML = '<span style="font-size:.6em">≈</span> ' + usd(Math.round(V.total * ease((t - 11.6) / 0.9)));
  var bw = $('big').scrollWidth; $('big').style.transform = 'scale(' + Math.min(1, 900 / bw) + ')';
  $('netl').innerHTML = 'на руки ≈ ' + usd(V.net) + '<br>после комиссии Steam'; $('netl').style.opacity = clamp((t - 12.3) / 0.25, 0, 1);
  $('note').innerHTML = 'пример, цены Steam<br>на ' + V.date; $('note').style.opacity = clamp((t - 12.6) / 0.25, 0, 1);
  $('psh').style.left = (-300 + ease((t - 12.0) / 0.8) * 1500) + 'px';
}

// ?preview — черновик без записи экрана: 0–1,5 с скины, затем сразу карточки и итог (8–14 с).
var PREVIEW = /preview/.test(location.search);
window.frameAt = function (t) {
  if (PREVIEW && t >= 1.5) t = t - 1.5 + 8;
  drawBg(t); drawHero(t); drawCards(t); drawTotal(t); word(t); drawGrain(t);
  $('hook').style.transform = 'scale(' + (0.9 + 0.1 * back(t / 0.25)) + ')';
};
window.frameAt(0);
</script></body></html>
