<!doctype html>
<!-- Ролик «Гонка за сутки» (свой каркас): циферблат 24 ч, у AK-47 | Slate сыплются продажи, у ножа — две. Потом таблица продаж за сутки.
     Данные work/liq (объём = продажи Steam за 24 ч на дату сбора), запись liq1. Монтаж — engine/kit.js. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="engine/kit.css">
<style>
#H{font-size:84px}
#dial{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(var(--hi),.35),rgba(var(--mid),.7) 55%,rgba(var(--deep),.95));
  border:3px solid rgba(var(--edge),.45);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.25)}
#dial .lb{position:absolute;font-weight:900;font-size:52px;color:rgba(255,255,255,.8);width:90px;text-align:center;margin-left:-45px;margin-top:-30px}
#dial .hd{position:absolute;left:50%;bottom:50%;width:12px;margin-left:-6px;border-radius:6px;background:linear-gradient(#ffe27a,#f0a020);box-shadow:0 0 24px rgba(255,210,63,.8);transform-origin:50% 100%}
#dial .ct{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#FFD23F}
.lane{justify-content:flex-start!important;padding-top:20px}
.lane img{width:300px;height:160px;object-fit:contain;filter:drop-shadow(0 16px 16px rgba(0,0,0,.6))}
.lane .nm{font-size:48px;margin-top:6px}.lane .pp{font-size:52px;margin-top:4px}
.lane .cn{font-size:150px;letter-spacing:-5px;line-height:1;margin-top:14px}
#VS{font-size:140px;letter-spacing:-4px}
#TH{font-size:60px}#ANS{font-size:64px}#NOTE{font-size:44px;font-weight:700}#TIP{font-size:44px}
.row{position:absolute;left:70px;width:810px;height:118px}
.row img{position:absolute;left:0;top:4px;width:150px;height:110px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))}
.row .bar{position:absolute;left:170px;top:22px;height:74px;border-radius:20px;background:linear-gradient(90deg,#f0a020,#ffd23f);box-shadow:0 0 24px rgba(255,180,60,.5)}
.row .num{position:absolute;top:18px;font-weight:900;font-size:64px;letter-spacing:-2px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5)}
#big{position:absolute}

.cta{font-size:72px}
</style></head><body>
<script src="work/liq/vdata.js"></script>
<script src="engine/kit.js"></script>
<script>
var V = window.V;
V.items.forEach(function (x) { if (!(x.volume >= 0)) throw new Error('нет объёма продаж: ' + x.name); });
var rows = V.items.slice().sort(function (a, b) { return b.volume - a.volume; }), lead = rows[0];
var knife = V.items.filter(function (x) { return /^★/.test(x.name); })[0]; if (!knife) throw new Error('нет ножа в наборе');
var N = lead.volume, M = knife.volume, KX = M > 0 ? Math.floor(N / M) : null;
function plural(n, a, b, c) { var m = n % 100, d = n % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; }
var short = function (x) { return x.short.split(' | ')[1]; };
var R0 = 1.92, RD = 6.72, E = {};
var knifeAt = M > 0 ? Array.apply(null, Array(Math.min(M, 6))).map(function (_, i) { return R0 + RD * (i + 1) / (Math.min(M, 6) + 1); }) : [];
KIT.run({
  base: 'work/liq/', dur: 27.6, holds: [[1.6, 1.4], [9.2, 1.2], [11.4, 1.2], [13.0, 2.4], [16.6, 1.4]],
  cuts: [1.92, 9.60, 13.44, 15.36, 17.28],
  punches: knifeAt.map(function (t) { return [t, 0.08]; }).concat([[8.64, 0.07], [11.52, 0.04]]),
  mb: [[2.0, 70, 250, -2, 0.8], [8.6, 'off'], [9.7, 'r', 440, 2, 1], [11.45, 'off'], [15.45, 'c', 470, 0, 1]],
  segs: [{ t0: 13.44, t1: 15.36, clip: 'liq1', c0: 7.90, n: 376, rect: [150, 600, 680, 840], tilt: [-14, 0],
    k: [[0, 540, 1500, 1.0], [1.92, 540, 1550, 1.0]] }],
  pops: [{ at: 15.0, box: [29, 537.7, 332, 44], text: 'Подробнее', size: 120, to: [475, 1020] }],
  init: function (K) {
    E.halo = K.el('', ''); E.halo.style.cssText = 'position:absolute;left:-60px;top:560px;width:1200px;height:800px;border-radius:50%;filter:blur(90px);opacity:.7';
    E.knife = K.gun3d(K.B + knife.img, [80, 720, 800, 460], 20, 3.2);
    E.H = K.plate('Нож за <span class="g">' + K.usd(knife.cents) + '</span>.<br>Сколько продаж<br>за сутки?', [70, 220, 940, 340]); E.H.id = 'H';
    E.dial = K.el('', ''); E.dial.id = 'dial';
    [['0', 0], ['6', 90], ['12', 180], ['18', 270]].forEach(function (l) { var d = K.el(l[0], 'lb', E.dial); d.dataset.a = l[1]; });
    E.hand = K.el('', 'hd', E.dial); K.el('', 'ct', E.dial);
    function lane(x, it, rect) {
      var p = K.plate('<img src="' + K.B + it.img + '"><div class="nm">' + short(it) + '</div><div class="pp mut">' + K.usd(it.cents) + '</div><div class="cn g">0</div>', rect);
      p.classList.add('lane'); return p;
    }
    E.L = lane(0, lead, [70, 700, 400, 740]); E.Rt = lane(0, knife, [500, 700, 390, 740]);
    E.VS = K.plate('<span class="g">' + N + '</span> : <span class="r">' + M + '</span>', [70, 240, 940, 300]); E.VS.id = 'VS';
    E.TH = K.plate('Продажи за сутки<br><span class="mut" style="font-size:44px">Steam · ' + V.date + '</span>', [70, 220, 940, 180]); E.TH.id = 'TH';
    E.tabw = K.el('', ''); E.tabw.style.cssText = 'position:absolute;inset:0;clip-path:inset(560px 0 440px 0)';
    E.tab = K.el('', '', E.tabw); E.tab.style.cssText = 'position:absolute;inset:0';
    E.rows = rows.map(function (it, i) {
      var r = K.el('<img src="' + K.B + it.img + '"><div class="bar"></div><div class="num">' + it.volume + '</div>', 'row', E.tab);
      r.style.top = (640 + i * 132) + 'px'; return r;
    });
    E.ANS = K.plate('Нож — ' + M + ' ' + plural(M, 'продажа', 'продажи', 'продаж') + ' за сутки<br>' + (KX ? 'в <span class="g">' + KX + '</span> ' + plural(KX, 'раз', 'раза', 'раз') + ' реже, чем ' + short(lead) : 'ни одной продажи'), [70, 220, 940, 300]); E.ANS.id = 'ANS';
    E.c0 = K.plate('Перед покупкой<br><span class="g">ножа</span>', [70, 220, 940, 220]); E.c0.style.fontSize = '76px';
    E.c1 = K.plate('Проверь, как быстро<br><span class="g">он продаётся</span>', [70, 640, 810, 260]); E.c1.classList.add('cta');
    E.c2 = K.plate('Бесплатно —<br><span class="g">@cenolow_bot</span>', [70, 940, 810, 260]); E.c2.classList.add('cta');
    E.NOTE = K.plate('продажи Steam за сутки · ' + V.date, [70, 220, 940, 110]); E.NOTE.id = 'NOTE';
    E.TIP = K.plate('В боте: «Как быстро продаётся»', [70, 1320, 810, 120]); E.TIP.id = 'TIP';
  },
  scene: function (t, K) {
    // Крючок с ножом — в начале и снова в конце (петля).
    var hookOn = t < 1.92 || t >= 17.28;
    var kOp = t < 1.92 ? 1 : t >= 17.28 ? 0.5 * K.ease((t - 17.28) / 0.4) : 0;
     E.halo.style.opacity = (0.7 * kOp).toFixed(2);
    var c = K.vivid(knife.tint); E.halo.style.background = 'radial-gradient(' + K.rgba(c, .8) + ',' + K.rgba(c, .2) + ' 45%,transparent 70%)';
    E.knife.pose(K.tr, { rz: -12 + Math.sin(K.tr * 0.9) * 5, ry: Math.sin(K.tr * 0.9) * 36, rx: 12, s: 1 + 0.03 * Math.sin(t * 1.3), op: kOp, blur: t >= 17.28 ? 12 : 0 });
    K.slam(E.H, t, 0.05, 'z', 1.8, 'l');
    // Концовка — призыв (вместо повтора начала).
    K.slam(E.c0, t, 17.35, 'z'); K.slam(E.c1, t, 17.5, 'r'); K.slam(E.c2, t, 17.9, 'l');

    // Циферблат: сверху во время гонки, крупно в конце.
    var dialOn = (t >= 1.92 && t < 8.64) || (t >= 15.36 && t < 17.28);
    E.dial.style.display = dialOn ? 'block' : 'none';
    if (dialOn) {
      var big = t >= 15.36, D = big ? 600 : 420, cx = 540 - 65 * big, cy = big ? 1000 : 440;
      E.dial.style.left = (cx - D / 2) + 'px'; E.dial.style.top = (cy - D / 2) + 'px'; E.dial.style.width = D + 'px'; E.dial.style.height = D + 'px';
      var e = K.back((t - (big ? 15.36 : 1.92)) / 0.4); E.dial.style.transform = 'scale(' + e.toFixed(3) + ')';
      E.dial.querySelectorAll('.lb').forEach(function (l) { var a = (+l.dataset.a - 90) * Math.PI / 180, r = D / 2 - 56; l.style.left = (D / 2 + r * Math.cos(a)) + 'px'; l.style.top = (D / 2 + r * Math.sin(a)) + 'px'; });
      var u = big ? ((t - 15.36) / 1.92) : K.clamp((t - R0) / RD, 0, 1);
      E.hand.style.height = (D / 2 - 40) + 'px'; E.hand.style.transform = 'rotate(' + (u * 360).toFixed(1) + 'deg)';
    }

    // Гонка: две дорожки, у Slate чеки сыплются непрерывно, у ножа — по одному на каждую продажу.
    var raceOn = t >= 1.92 && t < 9.6;
    if (raceOn) { K.slam(E.L, t, 1.92, 'b', 9.45, 'b'); K.slam(E.Rt, t, 2.0, 'b', 9.45, 'b'); } else { E.L.style.visibility = E.Rt.style.visibility = 'hidden'; }
    var u2 = K.clamp((t - R0) / RD, 0, 1), nL = Math.round(N * u2), nR = knifeAt.filter(function (x) { return t >= x; }).length;
    if (M > knifeAt.length && u2 >= 1) nR = M;
    E.L.querySelector('.cn').textContent = nL; E.Rt.querySelector('.cn').textContent = nR;
    if (raceOn && t < 9.45) {
      var g = K.pc, colY = 1420, colH = 220;
      // колонна Slate: заполняется по мере продаж
      g.save(); g.fillStyle = 'rgba(255,210,63,.18)'; g.fillRect(110, colY - colH, 320, colH);
      var fillH = colH * u2; var gr = g.createLinearGradient(0, colY - fillH, 0, colY); gr.addColorStop(0, '#ffe27a'); gr.addColorStop(1, '#f0a020');
      g.fillStyle = gr; g.shadowColor = 'rgba(255,190,60,.6)'; g.shadowBlur = 20; g.fillRect(110, colY - fillH, 320, fillH); g.restore();
      // падающие чеки
      var shown = 0;
      for (var i = nL; i > 0 && shown < 60; i--) {
        var ti = R0 + RD * i / N, dt = t - ti; if (dt > 0.45) break; if (dt < 0) continue; shown++;
        var x = 130 + ((i * 97) % 260), y0 = 1185, y1 = colY - colH * (i / N), y = y0 + (y1 - y0) * (dt / 0.45);
        g.save(); g.fillStyle = '#FFD23F'; g.globalAlpha = 0.9; g.shadowColor = 'rgba(255,210,63,.8)'; g.shadowBlur = 12; g.fillRect(x, y, 34, 22); g.restore();
      }
      // колонна ножа: настоящие продажи — отдельные крупные чеки
      g.save(); g.fillStyle = 'rgba(255,107,91,.12)'; g.fillRect(540, colY - colH, 310, colH); g.restore();
      knifeAt.forEach(function (ti, j) {
        if (t < ti) return; var dt = t - ti, y1 = colY - 46 - j * 52, y = dt < 0.4 ? 1185 + (y1 - 1185) * K.ease(dt / 0.4) : y1;
        g.save(); g.fillStyle = '#FFD23F'; g.shadowColor = 'rgba(255,210,63,.9)'; g.shadowBlur = 24; g.fillRect(600, y, 190, 40); g.restore();
      });
    }
    K.slam(E.VS, t, 8.64, 'z', 9.5, 't');

    // Таблица продаж за сутки.
    var tabOn = t >= 9.6 && t < 13.44;
    E.tab.style.display = tabOn ? 'block' : 'none';
    if (tabOn) {
      K.slam(E.TH, t, 9.6, 't', 11.45, 't');
      rows.forEach(function (it, i) {
        var r = E.rows[i], at = 9.7 + i * 0.24, p = K.clamp((t - at) / 0.45, 0, 1), w = Math.max(6, 560 * it.volume / N) * K.back(p);
        r.style.opacity = p > 0 ? 1 : 0; r.querySelector('.bar').style.width = w.toFixed(1) + 'px';
        r.querySelector('.num').style.left = (170 + w + 14).toFixed(1) + 'px';
        r.querySelector('.num').textContent = Math.round(it.volume * K.ease(p));
        r.style.filter = it === knife && t >= 11.52 ? 'drop-shadow(0 0 18px rgba(255,107,91,.9))' : 'none';
      });
      var z = K.ease((t - 11.52) / 0.8), ki = rows.indexOf(knife);
      E.tab.style.transformOrigin = '475px ' + (640 + ki * 132 + 59) + 'px';
      E.tab.style.transform = 'scale(' + (1 + 0.3 * z).toFixed(3) + ')';
    } else E.TH.style.visibility = 'hidden';
    K.slam(E.ANS, t, 11.52, 'r', 13.35, 'l');
    K.slam(E.NOTE, t, 15.4, 'r', 17.2, 'l');
    K.slam(E.TIP, t, 15.6, 'b', 17.2, 'b');
  }
});
</script></body></html>
