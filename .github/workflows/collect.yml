name: collect-prices
# Сбор цен Steam/Skinport для CS2 Market Bot (Cloudflare-сеть эти площадки блокируют).
# Основной запуск — Worker сам нажимает «Run workflow» (kick_collector, раз в ~10 минут).
# Расписание здесь — только запасное, на случай если Worker не может запустить сборщик
# (поэтому реже: лишние прогоны не нужны). Расписание GitHub может запаздывать — это нормально.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # Сразу после правок сборщика — один прогон, чтобы проверить его.
  push:
    branches: [main]
    paths: ['.github/scripts/collect.mjs', '.github/scripts/patchnotes.mjs', '.github/workflows/collect.yml']
concurrency:
  group: collect-prices
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Дата для кэша картинок
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Каталог картинок (ByMykel/CSGO-API, ~80 МБ) качаем раз в сутки, дальше берём из кэша GitHub.
      - uses: actions/cache@v4
        with:
          path: .cache/catalog2.json
          key: catalog2-${{ steps.day.outputs.d }}
      - name: Сбор цен
        id: collect
        env:
          WORKER_URL: https://cs2-search.blauwi925.workers.dev
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: node .github/scripts/collect.mjs
      # Картинка для поста в канал — только когда Worker её заказал (несколько раз в день).
      - name: Картинка для поста
        if: steps.collect.outputs.card == '1'
        env:
          WORKER_URL: https://cs2-search.blauwi925.workers.dev
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          mkdir -p /tmp/pw && npm i --prefix /tmp/pw --no-save --silent playwright-core@1.49.1
          NODE_PATH=/tmp/pw/node_modules node .github/scripts/render-card.mjs
