name: probe-sources
# Разовая проверка: доступны ли Steam и Skinport с серверов GitHub (а не Cloudflare).
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Steam priceoverview (UAH)
        run: |
          for i in 1 2 3; do
            curl -s -o /tmp/s.txt -w "steam HTTP %{http_code}\n" "https://steamcommunity.com/market/priceoverview/?appid=730&currency=18&market_hash_name=Revolution%20Case"
            head -c 200 /tmp/s.txt; echo; sleep 3
          done
      - name: Skinport items
        run: |
          curl -s --compressed -H "Accept-Encoding: br" -o /tmp/k.txt -w "skinport HTTP %{http_code} size %{size_download}\n" "https://api.skinport.com/v1/items?app_id=730&currency=EUR&tradable=0"
          head -c 200 /tmp/k.txt; echo
      - name: Skinport sales history
        run: |
          curl -s --compressed -H "Accept-Encoding: br" -o /tmp/h.txt -w "skinport-sales HTTP %{http_code}\n" "https://api.skinport.com/v1/sales/history?app_id=730&currency=EUR&market_hash_name=Revolution%20Case"
          head -c 200 /tmp/h.txt; echo
      - name: CSFloat (без ключа — ожидается 401/403, важно не 1005)
        run: |
          curl -s -o /tmp/c.txt -w "csfloat HTTP %{http_code}\n" "https://csfloat.com/api/v1/listings?market_hash_name=Revolution%20Case&limit=1"
          head -c 200 /tmp/c.txt; echo
