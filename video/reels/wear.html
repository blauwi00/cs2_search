<!doctype html>
<!-- Ролик «Износ»: один AK-47 | Asiimov в пяти износах — цена в разы разная. Данные work/wear (vfetch.py --names, vdata.ts --out), записи wear1/wear2. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="engine/engine.css"><link rel="stylesheet" href="engine/extra.css"></head><body>
<script src="work/wear/vdata.js"></script>
<script src="engine/engine.js"></script>
<script>
var V = window.V, R = REEL, by = {}; V.items.forEach(function (x) { by[x.wear] = x; });
['FN', 'MW', 'FT', 'WW', 'BS'].forEach(function (w) { if (!by[w]) throw new Error('нет цены износа ' + w); });
var asc = V.items.slice().sort(function (a, b) { return a.cents - b.cents; }), lo = asc[0], FN = by.FN;
var ratio = Math.floor(FN.cents / lo.cents * 10) / 10;
REEL.run({
  base: 'work/wear/',
  hook: 'Один калаш —<br><span class="g">$' + Math.floor(lo.cents / 100) + '</span> и <span class="g">$' + Math.floor(FN.cents / 100) + '?</span>',
  words: [[0, 'ОДИН СКИН'], [1.5, 'ИЩЕМ'], [2.7, 'ПО-РУССКИ'], [3.9, 'ЦЕНА'], [6, 'ТОТ ЖЕ'], [8, 'ИЗНОСЫ'], [11.5, 'РАЗНИЦА'], [14.5, 'ПРОВЕРЬ'], [17.5, 'БЕСПЛАТНО']],
  hero: [FN, by.MW, lo],
  cards: { items: asc.map(function (x) { return { img: x.img, tint: x.tint, p: R.usd(x.cents), n: x.wear }; }) },
  total: { t0: 11.5, t1: 14.5,
    big: function (t) { var v = 1 + (ratio - 1) * R.ease((t - 11.6) / 0.9); return '×' + v.toFixed(1).replace('.', ','); },
    fc: { at: 12.35, html: '<b style="color:#FFD23F">' + R.usd(FN.cents - lo.cents) + '</b><span>разница за износ</span>' },
    nc: { at: 12.8, text: 'пример · цены Steam на ' + V.date } },
  segs: [
    { t0: 1.5, t1: 3.9, clip: 'wear1', c0: 4.06, n: 289, k: [[0, 540, 760, 1.2], [1.4, 540, 575, 1.3], [2.1, 540, 575, 2.2], [2.4, 540, 575, 2.2]] },
    { t0: 3.9, t1: 6.0, clip: 'wear1', c0: 7.0, n: 289, k: [[0, 540, 900, 1.05], [0.8, 420, 1880, 1.6], [2.1, 420, 1880, 1.75]] },
    { t0: 6.0, t1: 8.0, clip: 'wear2', c0: 5.01, n: 299, k: [[0, 540, 700, 1.2], [0.9, 540, 423, 1.3], [1.5, 540, 423, 2.2], [2.0, 540, 423, 2.2]] },
    { t0: 14.5, t1: 17.5, clip: 'wear2', c0: 6.9, n: 299, k: [[0, 540, 900, 1.05], [1.0, 420, 1880, 1.6], [3, 420, 1880, 1.85]] }
  ],
  pops: [{ at: 3.6, box: [13, 180.7, 364, 55], text: 'Factory New', size: 120 }, { at: 7.5, box: [13, 125.7, 364, 54], text: 'Field-Tested', size: 120 }]
});
</script></body></html>
