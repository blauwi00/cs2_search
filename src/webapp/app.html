/* Бегущая строка: карточки-чипсы */
.ticker.chips2{font-size:13.5px;color:var(--text);padding:3px 0}
.tk-in .tkc{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 5px;margin-right:8px;border-radius:13px;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 12%,transparent);vertical-align:middle}
.tkc .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 75%)}
.tkc .ti img{width:26px;height:26px;object-fit:contain}
.tkc .tn{font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tkc .tp{font-weight:800;font-size:12.5px;padding:3px 7px;border-radius:8px;color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.tk-in .tkc.info{padding:0 12px;color:var(--hint);font-weight:500}
/* Топ поддержки: золото */
.ticker.t2{height:28px;display:flex;align-items:center;border-radius:999px;margin:6px 0 0;flex:0 0 100%;background:rgba(255,207,77,.07);border:1px solid rgba(255,207,77,.2);opacity:1}
.ticker.t2 .tk-in span{margin-right:22px}
.gold{background:linear-gradient(90deg,#c9963a,#ffe7a0,#c9963a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gd 3s linear infinite}
@keyframes gd{to{background-position:-200% 0}}
.ticker.t2 b{color:#ffcf4d}
/* Заставка */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg2);transition:opacity .45s,transform .45s}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .sp{display:flex;flex-direction:column;align-items:center;gap:18px}
#splash{overflow:hidden}
/* «Сотворение Адама» с перчаткой CS2: руки выезжают из-за краёв и тянутся к радару, пальцы — к его краю. Чёрный фон картинки растворяется (screen). */
#splash .rad{position:relative;width:120px;height:120px}
#splash .hd{position:absolute;height:100px;width:auto;mix-blend-mode:screen;pointer-events:none}
#splash .hl{right:calc(100% + 2px);top:20px;animation:hdl .85s 0s cubic-bezier(.16,.84,.3,1) both}
#splash .hr{left:calc(100% + 2px);top:29px;animation:hdr .85s 0s cubic-bezier(.16,.84,.3,1) both}
@keyframes hdl{from{transform:translateX(-60vw);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes hdr{from{transform:translateX(60vw);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
#splash .nm{font-size:34px;font-weight:900;letter-spacing:-1px;animation:lgi .9s .25s cubic-bezier(.2,.9,.25,1) both}
#splash .sb{color:var(--hint);font-size:14px;animation:rise .6s .7s both}
@keyframes lgi{from{opacity:0;letter-spacing:12px;filter:blur(6px)}to{opacity:1;letter-spacing:-1px;filter:none}}
.ring{transform-origin:60px 60px;animation:rng 2.2s ease-out infinite}
@keyframes rng{from{transform:scale(.2);opacity:.9}to{transform:scale(1.1);opacity:0}}
/* Выбор темы */
.thg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tho{border-radius:16px;padding:12px;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.tho:active{transform:scale(.97)}.tho.on{border-color:var(--accent)}
.tho .sws{display:flex;gap:4px;margin:8px 0 6px}.tho .sws i{flex:1;height:18px;border-radius:5px}
.tho .tb{height:26px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800}
/* Анимации интерфейса: только transform/opacity, коротко. */
.seg{position:relative}.seg>button{position:relative;z-index:1}.seg:not(.scroll)>button.on{background:none}
.seg-ink{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--bg);transition:transform .25s cubic-bezier(.2,.8,.2,1),width .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tab.on .t{animation:tabPop .22s ease-out}
@keyframes tabPop{50%{transform:scale(1.14)}}
.balbtn .bn{display:inline-block}.balbtn .bn.chg{animation:balIn .3s ease-out}
@keyframes balIn{from{transform:translateY(60%);opacity:0}}
.tbar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--hint) 20%,transparent);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transform-origin:left;transform:scaleX(var(--p,0));animation:tbarIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes tbarIn{from{transform:scaleX(0)}}
.row.hit{position:relative}.row.hit:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--accent);opacity:0;animation:hitFl .9s ease-out 1 .3s;pointer-events:none}
@keyframes hitFl{30%{opacity:1}}
@media (prefers-reduced-motion:reduce){#view.enter>*,.sheet.on #sc>*,.hero:after,.sweep,.ring,.dot,.gold,.tab.on .t,.balbtn .bn,.tbar i,.row.hit:after{animation:none!important}.seg-ink{transition:none}}

/* ===== Тема «Золото»: чёрное и золото, много движения. Парящие скины с параллаксом, счётчики, блики, искры, 3D-скин. ===== */
html.gold{--gold:#e7b24c;--gold2:#f6d98a;--gold3:#a8741f;--sep:rgba(231,178,76,.14);--amber:#e7b24c}
html.gold body{background:radial-gradient(900px 600px at 50% -10%,rgba(231,178,76,.10),transparent 60%),#070707}
html.gold .top{background:rgba(7,7,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html.gold .logo{background:linear-gradient(135deg,var(--gold2),var(--gold3));box-shadow:0 0 18px -2px rgba(231,178,76,.55)}
html.gold .top h1{font-weight:800;letter-spacing:-.4px}
html.gold .card,html.gold .row,html.gold .rc,html.gold .stat,html.gold .grp,html.gold details.more{background:linear-gradient(180deg,#151515,#0f0f0f);border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 30px -20px #000;backdrop-filter:none;-webkit-backdrop-filter:none}
html.gold .balbtn{background:#141414;border:1px solid rgba(231,178,76,.35)}
html.gold .btn:not(.sec2):not(.danger):not(.link-danger){position:relative;overflow:hidden;background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--gold3));color:#1a1305;font-weight:800;box-shadow:0 8px 24px -10px rgba(231,178,76,.8)}
html.gold .btn:not(.sec2):not(.danger):not(.link-danger):after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:gshine 3.2s 1s ease-in-out infinite}
@keyframes gshine{0%,60%{left:-60%}100%{left:130%}}
html.gold .btn.sec2{background:#141414;border:1px solid rgba(231,178,76,.25);color:var(--gold2)}
html.gold .chip.on,html.gold .seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1305}
html.gold .tabs{background:rgba(7,7,7,.9);border-top:1px solid rgba(231,178,76,.12)}
html.gold .tab{position:relative}
html.gold .tab.on{color:var(--gold)}
html.gold .tab.on .t{animation:tbounce .5s cubic-bezier(.3,1.8,.5,1);text-shadow:none;filter:drop-shadow(0 0 8px rgba(231,178,76,.7))}
html.gold .tab.on:before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:tind .35s ease-out}
@keyframes tbounce{0%{transform:scale(.6) translateY(4px)}60%{transform:scale(1.18) translateY(-3px)}100%{transform:none}}
@keyframes tind{from{transform:scaleX(0)}to{transform:none}}
html.gold .act.a-buy{background:rgba(143,209,106,.14);color:#8fd16a}
html.gold .sec{color:#c9bfa7}
html.gold #view.enter .row{animation:slin .5s cubic-bezier(.2,.9,.25,1) both}
html.gold #view.enter .row:nth-of-type(2){animation-delay:.06s}html.gold #view.enter .row:nth-of-type(3){animation-delay:.12s}html.gold #view.enter .row:nth-of-type(4){animation-delay:.18s}html.gold #view.enter .row:nth-of-type(n+5){animation-delay:.24s}
@keyframes slin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
/* Фон: парящие скины (параллакс от наклона телефона) и золотая пыль */
#fx{display:none}
html.gold #fx{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
html.gold #view,html.gold .top{position:relative;z-index:1}html.gold .top{position:sticky}
#fx .fl{position:absolute;opacity:.34;transition:transform .25s ease-out;will-change:transform}
#fx .fl img{width:100%;display:block;animation:flt var(--d,9s) ease-in-out infinite alternate}
@keyframes flt{from{transform:translateY(-10px) rotate(var(--r0,-8deg))}to{transform:translateY(12px) rotate(var(--r1,6deg))}}
#fx i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--gold2);opacity:0;animation:dust var(--d,12s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}10%{opacity:.8}90%{opacity:.6}100%{opacity:0;transform:translate(var(--dx,20px),-105vh)}}
/* Главная «Золото»: сводка в две колонки, лучшая сделка с бегущим бликом по рамке и искрами, быстрые плитки */
.gsum{display:grid;grid-template-columns:1.15fr 1fr;border-radius:20px;padding:16px 4px;margin:4px 0 12px;background:linear-gradient(180deg,#161616,#0e0e0e);border:1px solid rgba(255,255,255,.06);cursor:pointer}
.gsum>div{padding:0 14px}.gsum>div+div{border-left:1px solid rgba(255,255,255,.08)}
.gsum .l{font-size:13px;color:#cfc8b6;display:flex;align-items:center;gap:6px}
.gsum .n{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin-top:6px;display:flex;align-items:center;gap:8px}
.gsum .n svg{animation:gup 2.4s ease-in-out infinite}
@keyframes gup{0%,100%{transform:none}50%{transform:translate(2px,-3px)}}
.gsum .p{font-size:44px;font-weight:900;letter-spacing:-1px;color:#8fd16a;margin-top:12px;text-shadow:0 0 22px rgba(143,209,106,.35)}
.gbest{position:relative;border-radius:20px;padding:2px;margin:0 0 12px;cursor:pointer;isolation:isolate;overflow:hidden}
.gbest:before{content:"";position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;margin:-75% 0 0 -75%;will-change:transform;z-index:-2;background:conic-gradient(from 0deg,rgba(231,178,76,.15),var(--gold2) 8%,rgba(231,178,76,.15) 18%,rgba(231,178,76,.15) 50%,var(--gold) 58%,rgba(231,178,76,.15) 68%);animation:gspin 4.5s linear infinite}
.gbest:after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:18px;background:linear-gradient(160deg,#1b1610,#0e0e0e 55%)}
@keyframes gspin{to{transform:rotate(360deg)}}
html.paused *,html.paused *:before,html.paused *:after{animation-play-state:paused!important}
.gbest .in{padding:14px 14px 12px}
.gbest .cr{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1305;font-weight:800;font-size:13px;border-radius:999px;padding:4px 11px}
.gbest .bd{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin-top:10px}
.gbest .im{position:relative}
.gbest .im img{width:100%;max-height:96px;object-fit:contain;animation:flt 4s ease-in-out infinite alternate;--r0:-5deg;--r1:2deg;filter:drop-shadow(0 8px 14px rgba(0,0,0,.8))}
.gbest .nm{font-weight:800;font-size:16px;margin-top:4px;line-height:1.2}
.gbest .kv{border-color:rgba(255,255,255,.08);font-size:13.5px;padding:6px 0}
.gbest .kv .v{font-weight:800;font-size:15.5px;white-space:nowrap}.gbest .kv span:first-child{font-size:12.5px;color:#bdb6a4}
.gbest .ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.gbest .pf{color:#8fd16a;font-weight:800;font-size:17px;animation:gpulse 2.2s ease-in-out infinite}
@keyframes gpulse{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 16px rgba(143,209,106,.6)}}
.gbest .go{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1305;font-weight:900;font-size:20px;animation:gnudge 1.8s ease-in-out infinite}
@keyframes gnudge{0%,100%{transform:none}50%{transform:translateX(3px)}}
.gbest s{position:absolute;width:6px;height:6px;text-decoration:none;background:radial-gradient(circle,#fff 0 18%,var(--gold2) 30%,transparent 70%);animation:twk 2.6s ease-in-out infinite;pointer-events:none}
.gbest s:before,.gbest s:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%)}
.gbest s:after{transform:translate(-50%,-50%) rotate(90deg)}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.gtiles button{border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,#151515,#0f0f0f);border-radius:16px;padding:14px 6px;color:#eee;font-size:13px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .15s}
.gtiles button:active{transform:scale(.94)}
.gtiles svg{width:26px;height:26px;stroke:#eee;transition:stroke .2s}
.gtiles button:active svg{stroke:var(--gold)}
html.gold #view.enter .gtiles button{animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
html.gold #view.enter .gtiles button:nth-child(2){animation-delay:.08s}html.gold #view.enter .gtiles button:nth-child(3){animation-delay:.16s}
/* Окно скина: оружие парит, его можно повернуть пальцем; цены площадок влетают по очереди, лучшая — золотом */
html.gold .sheet{background:#0b0b0b;border-top:1px solid rgba(231,178,76,.18)}
html.gold .hero-img{width:240px;height:150px;perspective:600px;animation:flt 4.5s ease-in-out infinite alternate;--r0:-3deg;--r1:3deg;filter:drop-shadow(0 18px 22px rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(231,178,76,.18));touch-action:none;cursor:grab}
html.gold #pricebox .kv{animation:slin .45s cubic-bezier(.2,.9,.25,1) both}
html.gold #pricebox .kv:nth-child(2){animation-delay:.05s}html.gold #pricebox .kv:nth-child(3){animation-delay:.1s}html.gold #pricebox .kv:nth-child(4){animation-delay:.15s}html.gold #pricebox .kv:nth-child(5){animation-delay:.2s}html.gold #pricebox .kv:nth-child(n+6){animation-delay:.25s}
html.gold #pricebox .pos{color:var(--gold2);text-shadow:0 0 12px rgba(231,178,76,.5)}
html.gold #splash{background:#050505;--accent:var(--gold)}
@media (prefers-reduced-motion:reduce){#fx,.gbest:before,.gbest s,.gbest .pf,.gbest .go,.gsum .n svg{animation:none!important}#fx .fl img,#fx i{animation:none!important}}

/* «Золото» — кнопки: металлическая клавиша с объёмом (нажатие проваливает её), волна от пальца, второстепенные — плитки по две */
html.gold .btn{position:relative;overflow:hidden;border-radius:16px;min-height:52px;font-size:15.5px;letter-spacing:.1px;transition:transform .09s ease,box-shadow .09s ease,filter .2s}
html.gold .btn:not(.sec2):not(.danger):not(.link-danger){background:linear-gradient(180deg,#fbe7a8 0%,#efc260 38%,#d89a33 62%,#b97d22 100%);color:#2a1b04;text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,76,14,.45),0 5px 0 #7a5212,0 14px 26px -10px rgba(231,178,76,.75)}
html.gold .btn:not(.sec2):not(.danger):not(.link-danger):active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(120,76,14,.4),0 1px 0 #7a5212,0 6px 14px -8px rgba(231,178,76,.6)}
html.gold .btn.sec2{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:58px;margin:10px 0 0;padding:10px 8px;font-size:13.5px;line-height:1.25;font-weight:700;color:#f2e6c8;background:radial-gradient(120% 140% at 50% 0%,rgba(231,178,76,.16),transparent 60%),linear-gradient(180deg,#191712,#0f0e0b);border:1px solid rgba(231,178,76,.32);box-shadow:inset 0 1px 0 rgba(255,236,190,.12),0 4px 0 #050505,0 10px 20px -14px rgba(0,0,0,.9)}
html.gold .gpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}html.gold .gpair.one{grid-template-columns:1fr}html.gold .gpair .btn.sec2{margin:0;min-height:64px}html.gold .gpair:not(.one) .btn.sec2:last-child:nth-child(odd){grid-column:1/-1}
html.gold .btn.sec2:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,236,190,.1),0 1px 0 #050505}
html.gold .btns .btn.sec2{width:auto;margin:10px 0 0;min-height:52px}
html.gold .btns{gap:10px}
html.gold .btn.danger{border-radius:16px;box-shadow:0 4px 0 #2a0b0b}
html.gold .rip{position:absolute;border-radius:50%;pointer-events:none;width:10px;height:10px;margin:-5px 0 0 -5px;background:radial-gradient(circle,rgba(255,240,200,.85),rgba(231,178,76,.35) 45%,transparent 70%);animation:rip .6s ease-out forwards}
@keyframes rip{from{transform:scale(1);opacity:1}to{transform:scale(46);opacity:0}}

/* «Золото» без смайликов: вместо них — тонкие линейные иконки одного стиля */
html.gold .btn .bi{width:19px;height:19px;flex:none;margin-right:8px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
html.gold .btn.sec2 .bi{display:inline-block;margin:0 8px 0 0;stroke:var(--gold2)}
html.gold .gpair:not(.one) .btn.sec2{flex-direction:column}html.gold .gpair:not(.one) .btn.sec2 .bi{display:block;margin:0 auto 6px;width:22px;height:22px}
html.gold a{color:var(--gold2)}
html.gold .ic .gi{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
html.gold .ic{background:linear-gradient(180deg,#1c1a14,#100f0c);border:1px solid rgba(231,178,76,.22)}
</style>
</head>
<body>

  var h = '<h2>' + esc(d.name) + '</h2><div class="sub"><span class="badge b-' + d.priority + '">приоритет: ' + (PRI[d.priority] || d.priority) + '</span> · обновлено ' + ago(d.updatedAt) + '</div>';
  h += '<div class="card" style="text-align:center"><div class="mut" style="font-size:13px">Разница после комиссий</div><div class="big-num pos">' + uah(d.spreadKop, true) + '</div><div class="mut">' + pct(d.roiBp) + ' к затратам · баланс Steam</div></div>';
  h += '<div class="card">' +
    kv('Покупка, ' + (SRC[d.buySource] || d.buySource), uah(d.buyKop) + (d.buyOriginal ? '<div class="mut" style="font-size:12px">' + (d.buyOriginal.minor / 100).toFixed(2).replace('.', ',') + ' ' + esc(d.buyOriginal.currency) + '</div>' : '')) +
    kv('Цена покупателя в Steam', uah(d.sellKop)) +
    kv('Придёт на баланс Steam', uah(d.proceedsKop)) +
    (d.breakEven ? kv('Без убытка, если продать от', uah(d.breakEven)) : '') +
    kv('Ликвидность', (LIQ[d.liquidity] || '—') + (d.salesPerDay != null ? ' · ~' + Math.round(d.salesPerDay) + ' продаж/день' : '')) +
    (d.fx ? kv('Курс НБУ', d.fx.rate.toFixed(4).replace('.', ',') + ' ₴ за 1 ' + esc(d.fx.base) + ' (' + esc(d.fx.date) + ')') : '') + '</div>';
  if (d.downside && d.downside.length) h += '<div class="card">' + d.downside.map(function (x) { return kv('Если Steam подешевеет на ' + x.dropBp / 100 + '%', '<span class="' + cls(x.spreadKop) + '">' + uah(x.spreadKop, true) + '</span>'); }).join('') + '</div>';
  if (d.basis) h += '<div class="note">Ориентир продажи: ' + esc(d.basis.replace(/\.$/, '')) + '.</div>';
  if (d.reasons && d.reasons.length && d.priority !== 'high') h += '<div class="note">Почему не выше: ' + esc(d.reasons.join('; ')) + '.</div>';
  h += '<div class="note">После покупки предмет может несколько дней быть недоступен для продажи в Steam. Цена продажи не гарантирована.</div>';
  h += '<div class="btns">' + (d.buyUrl ? '<button class="btn" id="b-buy">🛒 Купить на ' + (SRC[d.buySource] || d.buySource) + '</button>' : '') + '<button class="btn sec2" id="b-steam">Steam Market</button></div>';
  h += '<button class="btn sec2" id="b-bought">✅ Я купил — записать в инвентарь</button>';
  h += '<div class="btns"><button class="btn sec2" id="b-item">📈 График</button><button class="btn danger" id="b-hide">Скрыть</button></div>';
  sheet(h);
  if (d.buyUrl) $('#b-buy').onclick = function () { goBuy({ name: d.name, where: SRC[d.buySource] || d.buySource, priceKop: d.buyKop, platform: d.buySource, signalId: d.id, url: d.buyUrl }); };
  $('#b-steam').onclick = function () { openLink(d.steamUrl); };
  $('#b-item').onclick = function () { itemSheet(d.itemId); };
  $('#b-bought').onclick = function () { buyForm({ name: d.name, priceKop: d.buyKop, platform: d.buySource, signalId: d.id }); };
  $('#b-hide').onclick = function () { api('deals/' + d.id + '/hide', { method: 'POST' }).then(function () { haptic('ok'); toast('Скрыто'); closeSheet(); go(state.tab); }).catch(function (e) { toast(e.message); }); };
}
function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

// ---------- Рынок (наблюдение) ----------
// «Цены»: найти любой скин → цены на всех площадках, график, «Следить за ценой». Ниже — «Слежу»: свои цели.
// Предметы, попавшие в список сами из покупок, здесь не показываем — они в «Моих скинах».
var WEAR_RU = { 'Factory New': 'Прямо с завода', 'Minimal Wear': 'Немного поношенное', 'Field-Tested': 'После полевых испытаний', 'Well-Worn': 'Поношенное', 'Battle-Scarred': 'Закалённое в боях' };
/** «AK-47 | Slate (Field-Tested)» → название и износ отдельно, чтобы название не обрезалось вместе с износом. */
function splitName(n) {
  var m = /^(.*) \((Factory New|Minimal Wear|Field-Tested|Well-Worn|Battle-Scarred)\)$/.exec(n || '');
  return m ? { base: m[1], wear: WEAR_RU[m[2]] } : { base: n, wear: '' };
}
function openByName(name) {
  sheet('<div class="skel"></div><div class="skel" style="height:180px"></div>');
  api('item-id?name=' + encodeURIComponent(name)).then(function (r) { itemSheet(r.id); }).catch(function (e) { closeSheet(); toast(e.message); });
}
function market() {
  loading(4);
  api('watch').then(function (r) {
    state.cache.watch = r.items;
    var list = r.items.filter(function (x) { return x.source !== 'inventory'; });
    var h = '<div class="search"><input id="pq" placeholder="🔍 Найти скин, например «ак азимов»" autocomplete="off"></div><div id="psr"></div>';
    h += '<div class="p-rest"><div class="mut" style="font-size:13px;margin:-2px 2px 10px">Цены на всех площадках, график за месяц и уведомление, когда подешевеет.</div>';
    h += '<div class="sec sec-a">Слежу' + (list.length ? ' · ' + list.length + (r.limit ? ' из ' + r.limit : '') : '') + (list.length ? '<span style="margin-left:auto;text-transform:none;letter-spacing:0">цена в Steam</span>' : '') + '</div>';
    h += list.length ? list.map(function (x) {
      var now = x.steamLowKop != null ? x.steamLowKop : x.steamAvgKop, goal;
      if (!x.targetKop) goal = '<span class="mut">задать цель ›</span>';
      else if (now != null && now <= x.targetKop) goal = '<span class="pos">✅ цель ' + uahShort(x.targetKop) + ' достигнута</span>';
      else goal = '🎯 ' + uahShort(x.targetKop) + (now != null ? ' · осталось −' + Math.max(1, Math.round((now - x.targetKop) * 100 / now)) + '%' : '');
      // Полоска: насколько цена уже приблизилась к цели (цель / цена сейчас).
      var bar = x.targetKop && now != null && now > x.targetKop ? '<div class="tbar"><i style="--p:' + Math.max(0.05, Math.min(1, x.targetKop / now)).toFixed(3) + '"></i></div>' : '';
      var nm = splitName(x.name);
      var hit = x.targetKop && now != null && now <= x.targetKop;
      return '<div class="row' + (hit ? ' hit' : '') + '" data-item="' + x.itemId + '">' + pic(x.img, ICON[x.category] || '🎲') + '<div class="m"><div class="n">' + esc(nm.base) + '</div>' + (nm.wear ? '<div class="w">' + esc(nm.wear) + '</div>' : '') + '<div class="d">' + goal + '</div>' + bar + '</div>' +
        '<div class="r"><div class="big">' + (x.steamLowKop != null ? uahShort(x.steamLowKop) : x.steamAvgKop != null ? '≈ ' + uahShort(x.steamAvgKop) : '<span class="mut" style="font-size:13px;font-weight:500">нет цены</span>') + '</div></div></div>';
    }).join('') : '<div class="empty"><div class="e">🔔</div>Найди скин выше и нажми «Следить за ценой» — бот напишет, когда цена упадёт до твоей.<br><br><button class="btn sec2" id="p-try">Попробовать: Kilowatt Case</button></div>';
    h += '</div>';
    view.innerHTML = h;
    bindSearch($('#pq'), $('#psr'), function (name) { haptic(); openByName(name); }, '›');
    if ($('#p-try')) $('#p-try').onclick = function () { haptic(); openByName('Kilowatt Case'); };
    // Пока ищешь — подсказка и «Слежу» не мешают.
    $('#pq').addEventListener('input', function () { var on = $('#pq').value.trim().length >= 2; Array.prototype.forEach.call(document.querySelectorAll('.p-rest'), function (el) { el.style.display = on ? 'none' : ''; }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-item]'), function (el) {
      el.onclick = function () { haptic(); itemSheet(+el.getAttribute('data-item')); };
    });
  }).catch(fail);
}
function addSheet() {
  var h = '<h2>Добавить предметы</h2><div class="sub">Пиши по-английски, как в Steam: <i>revolution</i>, <i>ak-47 redline</i>…</div>';
  h += '<div class="search"><input id="aq" placeholder="🔍 Найти: «калаш азимов», «керамбит», AWP…" autocomplete="off"></div><div id="asr"></div>';
  h += '<div class="sec">Или списком</div><label class="f"><span>Каждый предмет с новой строки (точное название из Steam)</span><textarea id="alist" rows="5" style="width:100%;box-sizing:border-box;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--text);padding:10px;font:inherit"></textarea></label>';
  h += '<button class="btn" id="aadd">Добавить список</button>';
  sheet(h);
  var added = 0;
  bindSearch($('#aq'), $('#asr'), function (name) {
    api('watch', { method: 'POST', body: { name: name } }).then(function () { haptic('ok'); added++; toast('Добавлено: ' + name); $('#aq').focus(); }).catch(function (e) { toast(e.message); });
  }, '＋');
  $('#aadd').onclick = function () {
    var names = $('#alist').value.split(/\n+/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length >= 3; });
    if (!names.length) return toast('Список пуст');
    var chunks = []; for (var i = 0; i < names.length; i += 60) chunks.push(names.slice(i, i + 60));
    chunks.reduce(function (p, c) { return p.then(function () { return api('watch', { method: 'POST', body: { names: c } }); }); }, Promise.resolve())
      .then(function () { haptic('ok'); toast('Добавлено: ' + names.length); closeSheet(); market(); }).catch(function (e) { toast(e.message); });
  };
  window._onSheetClose = function () { if (added && state.tab === 'market') market(); };
}
function howOften(n) {
  n = n || {};
  var h = '<h2>Как часто обновляется</h2><div class="sub">Бот работает сам, 24/7, даже когда приложение закрыто.</div><div class="card info">';
  h += '<p>📥 <b>Цены</b> — сборщик забирает их примерно <b>каждые 10 минут</b> (расписание GitHub иногда опаздывает на 5–20 минут). Цены Steam обновляются по кругу: чем больше предметов в списках, тем дольше полный круг.</p>';
  h += '<p>🌍 <b>Рекомендации «Что купить»</b> (Skinport, Market.CSGO, Waxpeer, LIS-SKINS, Steam) — пересчитываются <b>каждые ~10 минут</b>.</p>';
  h += '<p>🧠 <b>Анализ</b> новых цен — каждую минуту.</p>';
  h += '<p>🔔 <b>Уведомления в Telegram</b> — ' + (n.enabled ? '<b>сразу</b>, как только находится выгодная сделка по твоему списку или срабатывает целевая цена. Одна и та же сделка повторно — не раньше чем через 6 часов (или если цена изменилась на 20%+). Не больше <b>' + n.maxPerHour + '</b> в час.' : '<b>выключены</b> (Ещё → Настройки).') + '</p>';
  h += '<p>🌙 <b>Тихие часы</b>: ' + n.quietStart + ':00–' + n.quietEnd + ':00 — ночью бот молчит.</p>';
  h += '<p>📊 <b>Сводка за день</b>: ' + (n.daily ? 'в ' + n.dailyHour + ':00' : 'выключена') + '.</p>';
  h += '</div><div class="note">Время — польское (Варшава). Всё это меняется в Ещё → Настройки.</div>';
  sheet(h);
}
function bindSearch(input, out, onPick, mark) {
  var timer;
  input.oninput = function () {
    clearTimeout(timer);
    var q = input.value.trim();
    if (q.length < 2) { out.innerHTML = ''; return; }
    timer = setTimeout(function () {
      api('search?q=' + encodeURIComponent(q)).then(function (r) {
        if (!r.results.length) { out.innerHTML = '<div class="card mut">' + (r.catalog.count ? 'Ничего не найдено. Попробуй иначе: «ак азимов», «керамбит», «AWP Asiimov».' : 'Поиск ещё готовится — попробуй через несколько минут.') + '</div>'; return; }
        out.innerHTML = '<div class="card" style="padding:4px 0">' + r.results.map(function (n, i) {
          return '<div class="kv" style="padding:8px 14px;cursor:pointer;align-items:center" data-pick="' + i + '"><span style="display:flex;align-items:center;gap:10px;min-width:0">' + pic((r.images || {})[n], ICON[guessCat(n)] || '🎲') + '<span>' + esc(n) + '</span></span><span class="v" style="color:var(--link)">' + (mark || '') + '</span></div>';
        }).join('') + '</div>';
        Array.prototype.forEach.call(out.querySelectorAll('[data-pick]'), function (el) {
          el.onclick = function () { var n = r.results[+el.getAttribute('data-pick')]; input.value = ''; out.innerHTML = ''; onPick(n); };
        });
      }).catch(function (e) { out.innerHTML = '<div class="card neg">' + esc(errText(e)) + '</div>'; });
    }, 250);
  };
}

// ---------- Карточка предмета ----------
function itemSheet(id, days) {
  days = days || 7;
  sheet('<div class="skel"></div><div class="skel" style="height:180px"></div><div class="skel"></div>');
  api('item/' + id + '?days=' + days).then(function (r) {
    var q = r.quotes, it = r.item;
    var h = (it.img ? '<img class="hero-img" src="' + esc(it.img) + '" alt="">' : '') + '<h2>' + esc(it.name) + '</h2><div class="sub">' + (ICON[it.category] || '') + ' ' + esc(it.categoryRu) + (it.stattrak ? ' · StatTrak™' : '') + (it.souvenir ? ' · Souvenir' : '') + '</div>';
    h += verdict(r.advice);
    if (it.uniquePriced) h += '<div class="card" style="color:var(--amber);font-size:14px">⚠️ Цена зависит от экземпляра (паттерн, фаза, float) — общие цены ориентировочные.</div>';
    var avg7 = r.steamAvg && r.steamAvg.d7;
    h += '<div class="grid2">' +
      stat('Steam сейчас', uahShort(q.steamLow && q.steamLow.kop), q.steamLow ? 'самый дешёвый лот · ' + ago(q.steamLow.at) : 'нет данных') +
      stat('Обычно продают за', avg7 ? '≈ ' + uahShort(avg7) : uahShort(q.steamMed && q.steamMed.kop), avg7 ? 'средняя за неделю' : 'медиана за сутки') + '</div>';
    h += '<div class="seg" id="dd"><button data-d="7" class="' + (days === 7 ? 'on' : '') + '">7 дней</button><button data-d="30" class="' + (days === 30 ? 'on' : '') + '">30 дней</button></div>';
    h += '<div class="card">' + chart(r.series, days, r.avg7Kop) + '</div>';
    h += pricesBoxHtml();
    // Всё остальное — для тех, кому интересно, под «Подробнее».
    var more = '';
    more += '<div class="card">' +
      kv('Skinport, объявление', q.skinport ? (q.skinport.kop == null ? (q.skinport.qty === 0 ? 'нет лотов' : '—') : uah(q.skinport.kop) + (q.skinport.qty != null ? '<div class="mut" style="font-size:12px;font-weight:400">лотов ' + q.skinport.qty + '</div>' : '')) : '—') +
      kv('Steam, медиана за сутки', uah(q.steamMed && q.steamMed.kop) + (q.steamMed && q.steamMed.volume != null ? '<div class="mut" style="font-size:12px;font-weight:400">продаж: ' + q.steamMed.volume.toLocaleString('ru-RU') + '</div>' : '')) +
      kv('Как быстро продаётся', esc(r.liquidity.ru) + (r.liquidity.perDay != null ? '<div class="mut" style="font-size:12px;font-weight:400">~' + Math.round(r.liquidity.perDay) + ' продаж/день</div>' : '')) + '</div>';
    if (r.steamAvg) more += '<div class="sec">Средняя цена продаж в Steam</div><div class="card">' +
      [['за сутки', r.steamAvg.d1], ['за неделю', r.steamAvg.d7], ['за месяц', r.steamAvg.d30], ['за 3 месяца', r.steamAvg.d90]].filter(function (x) { return x[1]; })
        .map(function (x) { return kv(x[0], '≈ ' + uah(x[1])); }).join('') + '</div>';
    if (r.stats && r.stats.count > 1) more += '<div class="note">На графике: мин ' + uahShort(r.stats.min) + ' · медиана ' + uahShort(r.stats.median) + ' · макс ' + uahShort(r.stats.max) + '</div>';
    var bt = r.backtest;
    if (bt.decisions >= 3) more += '<div class="sec">Проверка подсказок на истории</div><div class="card">' + kv('Сигнал был бы', bt.signals + ' раз') + kv('Выгода сохранилась через 24 ч', bt.held) + kv('Стала убытком', bt.reversed) + '</div>';
    more += '<div class="note">Линия — цена в Steam, пунктир — средняя за 7 дней: ниже пунктира — дешевле обычного. «≈» — пересчёт из долларов по курсу.</div>';
    h += '<details class="more"><summary><span class="chev">›</span> Подробнее: средние цены, ликвидность</summary>' + more + '</details>';
    h += '<div class="btns"><button class="btn sec2" id="i-steam">Steam Market</button>' + (r.links.skinport ? '<button class="btn sec2" id="i-sp">Skinport</button>' : '') + '</div>';
    if (r.watchId) {
      h += '<label class="f"><span>🎯 Уведомить, когда в Steam будет не дороже (' + CUR.sign + ')</span><input id="tg" inputmode="decimal" placeholder="например 120" value="' + (r.targetKop ? units(r.targetKop) : '') + '"></label>';
      h += '<div class="btns"><button class="btn" id="i-tg">Сохранить цель</button><button class="btn danger" id="i-del">Убрать</button></div>';
    } else h += '<button class="btn" id="i-add">🔔 Следить за ценой</button>';
    h += '<button class="btn sec2" id="i-buy">🎒 Записать покупку</button>';
    h += reportLink();
    $('#sc').innerHTML = h;
    $('#rep').onclick = function () { reportSheet(it.name, 'карточка предмета'); };
    loadPrices(it.name);
    Array.prototype.forEach.call(document.querySelectorAll('#dd button'), function (b) { b.onclick = function () { itemSheet(id, +b.getAttribute('data-d')); }; });
    $('#i-steam').onclick = function () { openLink(r.links.steam); };
    if (r.links.skinport) $('#i-sp').onclick = function () { openLink(r.links.skinport); };
    $('#i-buy').onclick = function () { buyForm({ name: it.name }); };
    if (r.watchId) {
      $('#i-tg').onclick = function () {
        var v = $('#tg').value.trim(); var kop = v ? toKop(v) : null;
        if (v && !(kop > 0)) return toast('Введи цену, например 120');
        api('watch/' + r.watchId + '/target', { method: 'POST', body: { kop: kop } }).then(function () { haptic('ok'); toast(kop ? 'Цель сохранена' : 'Цель убрана'); }).catch(function (e) { toast(e.message); });
      };
      $('#i-del').onclick = function () { api('watch/' + r.watchId, { method: 'DELETE' }).then(function () { haptic('ok'); toast('Убрано из наблюдения'); closeSheet(); if (state.tab === 'market') market(); }); };
    } else $('#i-add').onclick = function () { api('watch', { method: 'POST', body: { name: it.name } }).then(function () { haptic('ok'); toast('Слежу — впиши цель ниже'); if (state.tab === 'market') market(); itemSheet(id, days); }).catch(function (e) { toast(e.message); }); };
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(errText(e)) + '</div>'; });
}
function chart(series, days, avg) {
  var W = 340, H = 170, L = 44, R = 6, T = 8, B = 22;
  var defs = [['steamLow', 'Steam объявление', '#8b6cff'], ['steamMed', 'Steam медиана', '#2fbf71'], ['skinport', 'Skinport', '#f2a93b']];
  var all = []; defs.forEach(function (d) { (series[d[0]] || []).forEach(function (p) { if (p.v != null) all.push(p.v); }); });
  if (all.length < 2) return '<div class="empty" style="padding:22px">📉 История ещё копится.<br><span style="font-size:13px">Точки появляются при каждом сборе цен.</span></div>';
  var now = Date.now() / 1000, from = now - days * 86400;
  if (avg) all.push(avg);
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all); if (mn === mx) { mn -= 100; mx += 100; }
  var pad = (mx - mn) * .1; mn = Math.max(0, mn - pad); mx += pad;
  function x(t) { return L + (t - from) / (now - from) * (W - L - R); }
  function y(v) { return T + (1 - (v - mn) / (mx - mn)) * (H - T - B); }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
  for (var i = 0; i <= 3; i++) { var v = mn + (mx - mn) * i / 3; s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="currentColor" stroke-opacity=".1"/><text x="' + (L - 5) + '" y="' + (y(v) + 3).toFixed(1) + '" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".55">' + Math.round(v / 100) + '</text>'; }
  for (var j = 0; j <= 3; j++) { var t = from + (now - from) * j / 3, dt = new Date(t * 1000); s += '<text x="' + x(t).toFixed(1) + '" y="' + (H - 6) + '" font-size="9" text-anchor="middle" fill="currentColor" fill-opacity=".55">' + String(dt.getDate()).padStart(2, '0') + '.' + String(dt.getMonth() + 1).padStart(2, '0') + '</text>'; }
  if (avg) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(avg).toFixed(1) + '" y2="' + y(avg).toFixed(1) + '" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="' + (W - R) + '" y="' + (y(avg) - 4).toFixed(1) + '" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".7">средняя 7 дн</text>';
  var gap = Math.max(3 * 3600, days * 86400 / 40);
  defs.forEach(function (d) {

    pts.forEach(function (p) { if (last != null && p.t - last > gap) flush(); seg.push(x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)); last = p.t; });
    flush();
  });

  return s;
}

      .then(function () { haptic('ok'); closeSheet(); toast('Спасибо! Передал владельцу'); })
      .catch(function (e) { $('#rsend').disabled = false; toast(e.message); });
  };
}
function suggestSheet() {
  var h = '<h2>💡 Предложка канала</h2><div class="sub">Что стоит опубликовать: новость, находку на рынке, идею, полезный совет. Владелец посмотрит и решит. Публикуется без имени — «от подписчика».</div>';
  h += '<label class="f"><span>Текст</span><textarea id="sgt" rows="5" maxlength="900" placeholder="например: на Skinport сейчас скидки на кейсы Kilowatt" style="width:100%;resize:vertical"></textarea></label>';
  h += '<button class="btn" id="sgs">Отправить</button><div class="note">Картинку можно прислать в чате с ботом: команда /suggest. Ссылки на сторонние сайты и реклама не публикуются. До 3 предложений в сутки.</div>';
  sheet(h);
  $('#sgs').onclick = function () {
    var t = $('#sgt').value.trim();
    if (t.length < 10) return toast('Слишком коротко — опиши хотя бы парой предложений');
    $('#sgs').disabled = true;
    api('suggest', { method: 'POST', body: { text: t } })
      .then(function () { haptic('ok'); closeSheet(); toast('Спасибо! Если опубликуем — бот напишет'); })
      .catch(function (e) { $('#sgs').disabled = false; toast(e.message); });
  };
}
function donateSheet() {
  var h = '<h2>💛 Поддержать Ценолова</h2><div class="sub">Бот бесплатный и работает круглосуточно. Если он помог — можно отправить звёзды Telegram. Это добровольно и ничего не открывает: бот остаётся бесплатным для всех.<br><br>Поддержавшие попадают во вторую бегущую строку «💛 Топ поддержки» — с именем из Telegram. Скрыть себя: /donate в боте → «Скрыть меня».</div>';
  h += '<div class="grid2" id="dons">' + [25, 50, 100, 250, 500].map(function (n) { return '<button class="btn sec2" data-n="' + n + '" style="margin:0">⭐ ' + n + '</button>'; }).join('') + '</div>';
  h += '<div class="note">Оплата проходит внутри Telegram. Вопросы по оплате — команда /paysupport в боте.</div>';
  sheet(h);
  Array.prototype.forEach.call(document.querySelectorAll('#dons button'), function (b) {
    b.onclick = function () {
      var n = +b.getAttribute('data-n');
      api('donate', { method: 'POST', body: { stars: n } }).then(function (r) {
        if (tg && tg.openInvoice) tg.openInvoice(r.link, function (st) { if (st === 'paid') { haptic('ok'); closeSheet(); toast('Спасибо за поддержку! 💛'); setTimeout(refreshTicker, 4000); } });
        else openLink(r.link);
      }).catch(function (e) { toast(e.message); });
    };
  });
}
function more() {
  var row = function (id, ic, n, d) { return '<div class="row" id="' + id + '"><div class="ic">' + ic + '</div><div class="m"><div class="n">' + n + '</div><div class="d">' + d + '</div></div><div class="mut">›</div></div>'; };
  view.innerHTML = '<div class="grp">' + row('m-invite', '🎁', 'Пригласить друга', 'Отправь ссылку на бота — откроется у друга в Telegram') + '</div><div class="grp">' +
    row('m-set', '⚙️', 'Настройки', 'Валюта, пороги прибыли, уведомления, тихие часы') +
    row('m-bal', '💳', 'Баланс Steam', state.bal ? 'Сейчас ' + uahShort(state.bal.kop) + ' — бот подбирает идеи под него' : 'Впиши — бот покажет идеи, на которые хватит') +
    row('m-sites', '🛒', 'Площадки', 'Где покупать и продавать, рейтинг сайтов') +
    row('m-help', '❓', 'Помощь и правила', 'Как часто обновляется, что знает бот, условия') +
    row('m-talk', '✉️', 'Связь с автором', 'Канал, предложить пост, сообщить об ошибке, поддержать') + '</div>' +
    (state.isAdmin ? '<div class="grp">' + row('m-own', '🛠', 'Для владельца', 'Панель, состояние системы') + '</div>' : '') +
    '<div class="note" style="margin-top:14px">Бот анализирует рынок и ничего не покупает сам. Суммы — в твоей валюте, пересчёт по курсу НБУ.</div>';
  var menu = function (items) {
    sheet('<div class="list-s">' + items.map(function (x, i) { return '<div class="row" data-mm="' + i + '"><div class="ic">' + x[0] + '</div><div class="m"><div class="n">' + x[1] + '</div><div class="d">' + x[2] + '</div></div><div class="mut">›</div></div>'; }).join('') + '</div>');
    Array.prototype.forEach.call(document.querySelectorAll('[data-mm]'), function (el) { el.onclick = function () { haptic(); items[+el.getAttribute('data-mm')][3](); }; });
  };
  if ($('#m-own')) $('#m-own').onclick = function () { haptic(); menu([['🛠', 'Панель владельца', 'Пользователи, Steam, домашний агент', ownerPanel], ['🏠', 'Домашний агент', 'Цены Steam с твоего компьютера, пока он включён', agentSheet], ['📣', 'Продвижение бесплатно', 'План рекламы бота, что уже сделано', promoSheet], ['🩺', 'Состояние системы', 'Источники, сборщик, курсы, ошибки', status]]); };
  $('#m-set').onclick = function () { haptic(); settings(); };
  $('#m-invite').onclick = function () { haptic(); inviteFriend(); };
  $('#m-sites').onclick = function () { haptic(); sitesSheet(); };
  $('#m-bal').onclick = function () { haptic(); balanceSheet(); };
  $('#m-help').onclick = function () {
    haptic();
    menu([
      ['⏱', 'Как часто обновляется', 'Цены, рекомендации, уведомления', function () { api('summary').then(function (s) { howOften(s.notify); }).catch(function (e) { toast(e.message); }); }],
      ['🛡', 'Что знает бот', 'Какие данные видит, чего не получает никогда', privacy],
      ['📄', 'Условия и риски', 'Бот — сборник информации, сделки на свой риск', termsSheet],
    ]);
  };
  $('#m-talk').onclick = function () {
    haptic();
    var open = function () {
      var items = [
        ['💡', 'Предложить пост в канал', 'Новость, находка, идея', suggestSheet],
        ['📮', 'Сообщить об ошибке', 'Неверная цена, битая ссылка, идея', function () { reportSheet(null, 'раздел «Ещё»'); }],
        ['💛', 'Поддержать проект', 'Звёздами Telegram, добровольно · топ поддержки', donateSheet],
      ];
      // Ссылка на канал — из сводки (сервер берёт её из своей памяти, без запроса к Telegram).
      if (state.channelUrl) items.unshift(['📣', 'Канал', 'Рекомендации дня, кейсы, итоги недели', function () { openLink(state.channelUrl); }]);
      menu(items);
    };
    if (state.channelUrl === undefined) api('summary').then(open, open); else open();
  };
}
function settings() {
  sheet('<div class="skel"></div><div class="skel"></div><div class="skel"></div>');
  api('settings').then(function (r) {
    var h = '<h2>Настройки</h2><div class="sub">Сохраняются сразу. Суммы — в ' + esc(CUR.code) + '.</div>';
    var groups = [['Сделки', ['budget_kop', 'max_buy_kop', 'recs_by_balance', 'min_profit_kop', 'min_roi_bp', 'min_liquidity']], ['Комиссии при оплате и выводе', ['deposit_fee_bp', 'withdraw_fee_bp']], ['Уведомления', ['notify_enabled', 'notify_recs', 'recs_per_day', 'min_priority', 'max_per_hour', 'quiet_start', 'quiet_end', 'sig_arbitrage', 'sig_change', 'sig_target', 'sig_inventory', 'change_threshold_bp']], ['Сводка и данные', ['weekly_report', 'daily_report', 'daily_hour', 'max_stale_min', 'src_steam', 'src_skinport', 'src_csfloat']]];
    var by = {}; r.settings.forEach(function (s) { by[s.key] = s; });
    if (r.currencies && r.currencies.length) {
      h += '<div class="sec">Валюта</div><div class="card" style="padding:4px 14px"><div class="kv" style="align-items:center"><span>Показывать цены в<div class="mut" style="font-size:12px">Пересчёт по курсу НБУ (RUB, BRL, ARS — через доллар). В Steam цена в твоём кошельке может немного отличаться.</div></span><select id="curSel" style="width:auto;max-width:46%;padding:7px 10px">' +
        r.currencies.map(function (c) { return '<option value="' + c.code + '"' + (c.code === CUR.code ? ' selected' : '') + '>' + esc(c.code + ' ' + c.sign + ' · ' + c.name) + '</option>'; }).join('') + '</select></div></div>';
    }
    groups.forEach(function (g) {
      h += '<div class="sec">' + g[0] + '</div><div class="card" style="padding:4px 14px">';
      g[1].forEach(function (k) {
        var s = by[k]; if (!s) return;
        // «Подбирать идеи под баланс Steam» — неактивна, пока баланс не вписан.
        var off = k === 'recs_by_balance' && !r.hasBalance, hint = k === 'recs_by_balance' ? (off ? 'Сначала впиши баланс — кнопка 💳 вверху' : s.hint) : null;
        if (s.kind === 'toggle') h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + (hint ? '<div class="mut" style="font-size:12px">' + esc(hint) + '</div>' : '') + '</span><label class="sw"><input type="checkbox" data-k="' + k + '"' + (s.value === '1' ? ' checked' : '') + (off ? ' disabled' : '') + '><b></b></label></div>';
        else if (s.kind === 'choice') h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + '</span><select data-k="' + k + '" style="width:auto;padding:7px 10px">' + s.choices.map(function (c) { return '<option value="' + c.v + '"' + (c.v === s.value ? ' selected' : '') + '>' + esc(c.t) + '</option>'; }).join('') + '</select></div>';
        else {
          var raw = s.kind === 'uah' ? units(Number(s.value)) : s.kind === 'percent' ? (Number(s.value) / 100).toString().replace('.', ',') : s.value;
          h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + (s.hint ? '<div class="mut" style="font-size:12px">' + esc(s.hint) + '</div>' : '') + '</span><input data-k="' + k + '" inputmode="decimal" value="' + esc(raw) + '" style="width:96px;text-align:right;padding:8px 10px">' + '</div>';
        }
      });
      h += '</div>';
    });
    $('#sc').innerHTML = h;
    if ($('#curSel')) $('#curSel').onchange = function () {
      api('settings', { method: 'POST', body: { key: 'currency', value: $('#curSel').value } }).then(function () {
        haptic('ok'); toast('Валюта: ' + CUR.code); state.cache = {}; go(state.tab); settings();
      }).catch(function (e) { toast(e.message); });
    };
    Array.prototype.forEach.call($('#sc').querySelectorAll('[data-k]'), function (el) {
      var k = el.getAttribute('data-k');
      var save = function () {
        var val = el.type === 'checkbox' ? el.checked : el.value;
        api('settings', { method: 'POST', body: { key: k, value: val } }).then(function () { haptic('ok'); toast('Сохранено'); if (k === 'recs_by_balance') { state.cache = {}; refreshBal(); } }).catch(function (e) { toast(e.message); });
      };
      if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.onchange = save; else el.onchange = save;
    });
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(errText(e)) + '</div>'; });
}
function status() {
  sheet('<div class="skel"></div><div class="skel"></div>');
  api('status').then(function (r) {
    var h = '<h2>Состояние системы</h2><div class="sub">' + (r.collector ? 'Steam и Skinport опрашивает сборщик GitHub Actions' : '') + '</div>';
    h += '<div class="card">' + r.sources.map(function (s) {
      return '<div class="kv"><span class="k">' + (SRC[s.source] || esc(s.source)) + (s.status !== 'ok' && (s.error || s.disabled) ? '<div style="font-size:12px;color:var(--hint)">' + esc(s.disabled || s.error) + '</div>' : '') + '</span><span class="v">' + srcStatus(s) + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="sec">Курсы НБУ</div><div class="card">' + (r.fx.length ? r.fx.map(function (f) { return kv('1 ' + f.base, f.rate.toFixed(4).replace('.', ',') + ' ₴ <span class="mut">(' + f.date + ')</span>'); }).join('') : '<span class="mut">ещё не загружены</span>') + '</div>';
    h += '<div class="sec">Задачи</div><div class="card">' + r.jobs.map(function (j) { return kv(esc(j.name), j.enabled ? (j.fails ? '⚠️ ошибок: ' + j.fails : '✅') : '⏸ выключена'); }).join('') + '</div>';
    if (r.jobs.some(function (j) { return !j.enabled; })) h += '<button class="btn sec2" id="jen">Включить отключённые задачи</button>';
    h += '<div class="sec">Сегодня</div><div class="card">' + kv('Снимков цен', r.counters.snapshots || 0) + kv('Уведомлений', r.counters.notifications || 0) + kv('Каталог для поиска', r.catalog.count ? r.catalog.count.toLocaleString('ru-RU') + ' названий' : 'ещё не загружен') + '</div>';
    if (r.errors.length) h += '<div class="sec">Последние ошибки</div><div class="card">' + r.errors.map(function (e) { return '<div class="kv"><span class="k">' + ago(e.at) + ' · ' + esc(e.source || '') + '</span><span class="v" style="font-size:13px;font-weight:400">' + esc(e.message.slice(0, 90)) + '</span></div>'; }).join('') + '</div>';
    $('#sc').innerHTML = h;
    if ($('#jen')) $('#jen').onclick = function () { api('jobs/enable', { method: 'POST' }).then(function () { toast('Включено'); status(); }); };
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(errText(e)) + '</div>'; });
}

if (!INIT) { view.innerHTML = '<div class="empty"><div class="e">🔒</div>Открой приложение из своего бота в Telegram — кнопкой «Приложение» рядом с полем ввода.</div>'; return; }
var start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
var hashTab = (location.hash || '').replace('#', '');
var first = ['deals', 'market', 'inv', 'more', 'rally'].indexOf(start) >= 0 ? start : ['deals', 'market', 'inv', 'more', 'rally'].indexOf(hashTab) >= 0 ? hashTab : 'home';
// Сначала — согласие с условиями (один раз). Без ответа сервера не блокируем: бот всё равно спросит в чате.
loading(3);
// Заставка-радар: один раз за запуск, ~1,8 с, нажатие — пропустить. При «Уменьшении движения» — без неё.
(function () {
  var sp = $('#splash'), seen = false;
  try { seen = sessionStorage.getItem('splash') === '1'; sessionStorage.setItem('splash', '1'); } catch (e) { /* без памяти — покажем */ }
  if (!sp || seen || THEME === 'tg' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  sp.style.display = '';
  var hide = function () { sp.classList.add('out'); setTimeout(function () { sp.style.display = 'none'; }, 480); };
  sp.onclick = hide; setTimeout(hide, 1150); // руки дотягиваются за ~1 с
})();
renderBal(); refreshBal();
api('terms').then(function (t) { if (t.accepted && !t.onboarded) onboarding(first); else if (t.accepted) { go(first); if (first !== 'home') refreshTicker(); } else termsGate(t, first); }).catch(function () { go(first); });
})();
</script>
