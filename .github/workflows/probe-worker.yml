# Разовая проверка: отвечает ли Worker и база (запускается push'ем этого файла).
name: probe-worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-worker.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          W: https://cs2-search.blauwi925.workers.dev
          S: ${{ secrets.INGEST_SECRET }}
        run: |
          for p in / /app; do echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' $W$p)"; done
          echo "ingest/items:"; curl -s -H "X-Ingest-Secret: $S" $W/ingest/items | head -c 400; echo
          echo "health:"; curl -s $W/health | head -c 400; echo
