<!doctype html>
<!-- Ролик «Сколько стоят твои скины»: смесь трёх образцов владельца (плашка-крючок, жёлтое слово, карточки как в рекламе Wise).
     Данные — work/vdata.js (живые цены Steam, vfetch.py + vdata.ts). Кадр задаёт window.frameAt(t); рендер: ../cinema/render.mjs -->
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0}
.hook{position:absolute;left:70px;width:940px;top:200px;height:230px;color:#fff;z-index:50;text-align:center;border-radius:34px;
  padding-top:31px;
  background:linear-gradient(135deg,rgba(var(--hi),.30),rgba(var(--mid),.6) 45%,rgba(var(--deep),.9));border:2px solid rgba(var(--edge),.35);
  box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.25);
  font-weight:900;font-size:80px;line-height:1.05;letter-spacing:-2px;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.hook .g{color:#FFD23F;text-shadow:0 0 28px rgba(255,210,63,.55)}
.mb{position:absolute;left:0;top:0;width:280px;height:96px;border-radius:16px;z-index:55;overflow:hidden;display:flex;align-items:center;gap:12px;padding:0 14px 0 10px;
  background:linear-gradient(160deg,#1b1406,#0b0a07 60%);border:3px solid #FFD23F;box-shadow:0 0 20px rgba(255,210,63,.4),0 12px 30px rgba(0,0,0,.55);color:#fff;white-space:nowrap}
.mb img{width:70px;height:70px;border-radius:14px;flex:none}
.mb .t{font-weight:900;font-size:34px;line-height:1;color:#FFD23F;text-transform:uppercase;letter-spacing:.5px}
.mb .u{font-weight:700;font-size:23px;margin-top:5px;opacity:.95}
.mb .sh{position:absolute;top:-30px;left:-200px;width:70px;height:180px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(20deg)}
.word{position:absolute;left:60px;right:60px;top:1330px;height:130px;text-align:center;font-weight:900;font-size:124px;line-height:130px;z-index:60;
  color:#FFD23F;text-shadow:0 0 30px rgba(255,210,63,.6),0 6px 0 rgba(0,0,0,.35);letter-spacing:1px}
/* Сцена 1: огромный скин со светом его цвета */
/* Окно основного видео: всё содержимое живёт в полосе y 555–1315 и не залезает на вопрос, баннер и жёлтое слово. */
#fx{position:absolute;left:0;top:565px;width:1080px;height:750px;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 46px,#000 calc(100% - 46px),transparent)}
#fxi{position:absolute;left:0;top:-565px;width:1080px;height:1920px;transform-origin:540px 935px}
#flash{position:absolute;inset:0;z-index:65;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.9),rgba(255,255,255,.25) 45%,transparent 75%)}
.card .sh{position:absolute;top:-60px;left:-300px;width:160px;height:400px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(20deg)}
#hero{position:absolute;inset:0}
/* Экран настоящего бота (запись rec.cjs) в окне-телефоне; камера наезжает на нужное место. */
#ph{position:absolute;left:150px;top:595px;width:780px;height:690px;border-radius:40px;overflow:hidden;background:#000;
  border:2px solid rgba(var(--edge),.35);box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 60px rgba(var(--glow),.25)}
#phimg{position:absolute;left:0;top:0;transform-origin:0 0}
/* Финал */
#fin{position:absolute;inset:0}
#fin .tc{flex-direction:column;gap:0}
#f1{top:600px;height:330px}#f1 img{width:170px;height:170px;border-radius:34px}#f1 b{font-weight:900;font-size:104px;color:#FFD23F;line-height:1;margin-top:14px;letter-spacing:1px;text-shadow:0 0 30px rgba(255,210,63,.5)}
#f2{top:960px;height:150px;font-weight:900;font-size:84px;color:#fff}
#f3{top:1140px;height:130px;font-weight:700;font-size:50px;color:rgba(255,255,255,.9)}
#halo{position:absolute;left:-200px;top:400px;width:1480px;height:1100px;border-radius:50%;filter:blur(90px);opacity:.75}
#heroimg{position:absolute;left:40px;top:600px;width:1000px;height:680px;object-fit:contain;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
#streak{position:absolute;left:-400px;top:0;width:260px;height:1920px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);mix-blend-mode:screen}
/* Сцена 2: карточки в перспективе */
#stage{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 40%}
#deck{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
.card{position:absolute;left:70px;width:830px;height:230px;border-radius:34px;transform-style:preserve-3d;
  background:linear-gradient(135deg,rgba(var(--hi),.30),rgba(var(--mid),.55) 45%,rgba(var(--deep),.85));
  border:2px solid rgba(var(--edge),.35);box-shadow:0 40px 60px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.25)}
.card .clip{position:absolute;inset:0;border-radius:34px;overflow:hidden}.card .gl{position:absolute;right:-60px;top:-80px;width:420px;height:360px;border-radius:50%;filter:blur(60px);opacity:.7}
.card img{position:absolute;left:18px;top:14px;width:340px;height:202px;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.card .p{position:absolute;right:40px;top:58px;font-weight:900;font-size:110px;letter-spacing:-3px;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.card .n{position:absolute;right:40px;bottom:26px;font-weight:700;font-size:68px;letter-spacing:-1.5px;opacity:.92;white-space:nowrap}
/* Сцена 3: итог на стеклянной плите */
#tot{position:absolute;inset:0;perspective:1600px}
#plate{position:absolute;left:50px;width:980px;top:600px;height:300px;border-radius:44px;transform-style:preserve-3d;
  background:linear-gradient(140deg,rgba(var(--hi),.28),rgba(var(--mid),.7) 50%,rgba(var(--deep),.9));border:2px solid rgba(var(--edge),.35);
  box-shadow:0 60px 120px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.25);text-align:center;overflow:hidden}
#plate .big{display:inline-block;margin-top:30px;font-weight:900;font-size:200px;line-height:1;color:#FFD23F;text-shadow:0 0 50px rgba(255,210,63,.55);letter-spacing:-7px;white-space:nowrap}
.tc{position:absolute;left:70px;width:940px;border-radius:30px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:22px;white-space:nowrap;
  background:linear-gradient(135deg,rgba(var(--hi),.26),rgba(var(--mid),.6) 45%,rgba(var(--deep),.9));border:2px solid rgba(var(--edge),.35);
  box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.25);letter-spacing:-1px}
#fc{top:950px;height:150px}#fc b{font-weight:900;font-size:88px;color:#FF6B5B}#fc span{font-weight:700;font-size:60px}
#nc{top:1130px;height:110px;font-weight:600;font-size:50px;color:rgba(255,255,255,.85)}
#plate .sh{position:absolute;top:-100px;width:200px;height:900px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(18deg)}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;z-index:70}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="fx"><div id="fxi"><div id="hero"><div id="halo"></div><img id="heroimg"><div id="streak"></div></div>
<div id="stage"><div id="deck"></div></div>
<div id="ph"><img id="phimg"></div>
<div id="fin"><div class="tc" id="f1"><img src="assets/avatar.png"><b>ЦЕНОЛОВ</b></div><div class="tc" id="f2">@cenolow_bot</div><div class="tc" id="f3">не покупает и не просит пароль</div></div>
<div id="tot"><div id="plate"><div class="sh" id="psh"></div><div class="big" id="big"></div></div><div class="tc" id="fc"></div><div class="tc" id="nc"></div></div>
</div></div>
<div id="flash"></div>
<div class="hook" id="hook"></div>
<div class="mb" id="mb"><img src="assets/avatar.png" onerror="this.style.display='none'"><div><div class="t">Ценолов</div><div class="u">@cenolow_bot</div></div><div class="sh" id="mbsh"></div></div>
<div class="word" id="word"></div>
<canvas id="grain" width="540" height="960" style="width:1080px;height:1920px"></canvas>
<script src="work/vdata.js"></script>
<script>
var V = window.V, $ = function (id) { return document.getElementById(id); };
// Цветовые темы (?theme=blue|violet|ember; по умолчанию ember — выбор владельца). Жёлтые суммы одинаковы во всех.
var THEMES = {
  blue: { bg: '#050A18', hi: '110,160,255', mid: '30,50,110', deep: '8,14,40', edge: '170,200,255', glow: '40,80,200', glow2: '14,24,70', topo: '90,130,220', def: [80, 140, 255] },
  violet: { bg: '#0B0614', hi: '190,140,255', mid: '70,35,120', deep: '22,10,40', edge: '215,185,255', glow: '120,60,220', glow2: '40,16,80', topo: '150,110,220', def: [160, 100, 255] },
  ember: { bg: '#0A0A0C', hi: '255,170,90', mid: '60,45,35', deep: '18,16,16', edge: '255,200,150', glow: '200,90,20', glow2: '50,28,12', topo: '160,120,90', def: [255, 140, 40] }
};
var T = THEMES[(location.search.match(/theme=(\w+)/) || [])[1]] || THEMES.ember;
['bg', 'hi', 'mid', 'deep', 'edge', 'glow'].forEach(function (k) { document.documentElement.style.setProperty('--' + k, T[k]); });
var usd = function (c) { return '$' + (c / 100).toFixed(2); };
var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
var ease = function (x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
var inout = function (x) { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
var back = function (x) { x = clamp(x, 0, 1); var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// Крючок из настоящих чисел: сколько стоит пример в Steam и сколько придёт после комиссии.
if (!(V.total > 0 && V.net > 0)) throw new Error('нет данных цен: рендер остановлен');
$('hook').innerHTML = '<span>Скинов на <span class="g">$' + Math.floor(V.total / 100) + '</span>,</span><br><span>а на руки <span class="g">$' + Math.floor(V.net / 100) + '?</span></span>';
function drawHook(t) {
  var p = (t - 0.05) / 0.4, e = back(p), el = $('hook');
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = 'translateX(' + ((1 - e) * 1100).toFixed(1) + 'px) rotate(' + ((1 - ease(p)) * -4).toFixed(2) + 'deg)';
  el.style.filter = p < 1 ? 'blur(' + ((1 - ease(p)) * 10).toFixed(1) + 'px)' : 'none';
}

// Мини-баннер Ценолова, как реклама на стриме: квадрат въезжает из-за края экрана, держится, уезжает; место меняется.
// [с, сторона ('l' слева, 'r' справа — правый край на 900, 'c' по центру), y, угол, масштаб]
var MB = [[0.6, 'r', 446, 2, 1], [1.5, 'l', 446, -2, 1], [3.9, 'r', 446, 2, 1], [6, 'l', 446, -2, 1], [8, 'r', 446, 2, 1], [10, 'l', 446, -2, 1], [11.5, 'c', 446, 0, 1], [14.5, 'r', 446, 2, 1], [17.5, 'off']];
function drawMb(t) {
  var el = $('mb'), cur = -1;
  for (var i = 0; i < MB.length; i++) if (t >= MB[i][0]) cur = i;
  if (cur < 0 || MB[cur][1] === 'off' && t > MB[cur][0] + 0.2) { el.style.opacity = 0; return; }
  if (MB[cur][1] === 'off') cur--;
  var m = MB[cur], nxt = cur + 1 < MB.length ? MB[cur + 1][0] : 1e9, W = 280 * m[4];
  var x = m[1] === 'c' ? 540 - W / 2 : m[1] === 'r' ? 900 - W : 70, off = m[1] === 'r' ? 1080 - x + 40 : m[1] === 'l' ? -(x + W + 40) : 0;
  var inP = back((t - m[0]) / 0.3), outP = ease((t - (nxt - 0.2)) / 0.2);
  var dx = off * (1 - inP) + off * clamp(outP, 0, 1), dy = 0;
  var rot = m[3] + Math.sin(t * 2.4) * 0.8;
  el.style.opacity = 1; el.style.transformOrigin = '0 0';
  var sc = m[1] === 'c' ? m[4] * clamp(inP, 0, 1.2) * (1 - clamp(outP, 0, 1)) : m[4];
  el.style.transformOrigin = '50% 50%';
  el.style.transform = 'translate(' + (x + dx).toFixed(1) + 'px,' + (m[2] + dy).toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
  $('mbsh').style.left = (-200 + ((t - m[0] - 0.3) % 1.6) / 0.6 * 600) + 'px';
}

// Цвет света скина (vfetch.py): усиливаем до яркого; почти серым скинам — фирменный зелёный.
var rgba = function (c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; };
function vivid(c) {
  var mx = Math.max(c[0], c[1], c[2]), mn = Math.min(c[0], c[1], c[2]);
  if (mx - mn < 25) return T.def;
  return c.map(function (v) { return 255 * Math.pow((v - mn) / (mx - mn), 1.4) * 0.85 + 30; });
}
var tints = {}; V.items.forEach(function (it) { tints['work/' + it.img] = vivid(it.tint); });

// Фон: глубокий зелёный, мягкий плывущий свет, виньетка, тонкая «топография».
var bg = $('bg').getContext('2d');
var centers = [[180, 380, 1.3], [900, 860, 2.1], [300, 1500, 0.7], [960, 1750, 2.9], [560, 1100, 4.2]];
function drawBg(t) {
  bg.fillStyle = T.bg; bg.fillRect(0, 0, 1080, 1920);
  var lx = 540 + 220 * Math.sin(t * 0.5), ly = 900 + 180 * Math.cos(t * 0.37);
  var g = bg.createRadialGradient(lx, ly, 0, lx, ly, 1100); g.addColorStop(0, 'rgba(' + T.glow + ',.55)'); g.addColorStop(.5, 'rgba(' + T.glow2 + ',.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  bg.fillStyle = g; bg.fillRect(0, 0, 1080, 1920);
  bg.strokeStyle = 'rgba(' + T.topo + ',.13)'; bg.lineWidth = 2;
  var dy = (t * 15) % 1920;
  for (var c = 0; c < centers.length; c++) for (var pass = 0; pass < 2; pass++) {
    var cx = centers[c][0], cy = centers[c][1] - dy + pass * 1920, ph = centers[c][2];
    for (var k = 1; k <= 14; k++) {
      bg.beginPath();
      for (var a = 0; a <= 64; a++) {
        var th = a / 64 * Math.PI * 2, r = k * 34 + 14 * Math.sin(3 * th + ph + k * 0.35 + t * 0.4) + 9 * Math.sin(5 * th - ph * 1.7 + k * 0.2);
        var x = cx + r * Math.cos(th) * 1.15, y = cy + r * Math.sin(th); if (a === 0) bg.moveTo(x, y); else bg.lineTo(x, y);
      }
      bg.stroke();
    }
  }
  // Пылинки в свете — глубина кадра.
  for (var q = 0; q < 26; q++) {
    var px = (q * 397 % 1080) + Math.sin(t * 0.6 + q) * 30, py = ((q * 733 % 1920) - t * (20 + q % 5 * 8) + 1920 * 4) % 1920, pr = 6 + q % 4 * 7;
    var pg = bg.createRadialGradient(px, py, 0, px, py, pr * 3); pg.addColorStop(0, 'rgba(' + T.edge + ',.22)'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    bg.fillStyle = pg; bg.fillRect(px - pr * 3, py - pr * 3, pr * 6, pr * 6);
  }
  var v = bg.createRadialGradient(540, 960, 500, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)');
  bg.fillStyle = v; bg.fillRect(0, 0, 1080, 1920);
}
// Зерно плёнки — детерминированное от номера кадра.
var gr = $('grain').getContext('2d'), gimg = gr.createImageData(540, 960);
function drawGrain(t) {
  var s = (Math.floor(t * 30) * 2654435761) >>> 0, d = gimg.data;
  for (var i = 0; i < d.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; var v = s >>> 24; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gr.putImageData(gimg, 0, 0);
}

var WORDS = [[0, 'СКИНЫ'], [1.5, 'ВХОДИМ'], [2.7, 'БЕЗ ПАРОЛЯ'], [3.9, 'ИНВЕНТАРЬ'], [6, 'ЦЕНА'], [8, 'СЧИТАЕМ'], [11.5, 'ИТОГО'], [12.5, 'НА РУКИ'], [14.5, 'УВЕДОМИТ'], [17.5, 'БЕСПЛАТНО']];
function word(t) {
  var w = WORDS[0]; for (var i = 0; i < WORDS.length; i++) if (t >= WORDS[i][0]) w = WORDS[i];
  $('word').textContent = w[1];
  $('word').style.transform = 'scale(' + (1 + 0.1 * (1 - clamp((t - w[0]) / 0.1, 0, 1))) + ')';
}

// Сцена 1 (0–1,5 с): три крупных скина со светом своего цвета, смена на долю такта с ударом и бликом.
var HERO = [V.items[1], V.items[0], V.items[2]];
function drawHero(t) {
  var on = t < 1.5; $('hero').style.display = on ? 'block' : 'none'; if (!on) return;
  var i = Math.min(2, Math.floor(t / 0.5)), l = t - i * 0.5, src = 'work/' + HERO[i].img, im = $('heroimg');
  if (im.getAttribute('src') !== src) im.src = src;
  var c = tints[src] || T.def;
  $('halo').style.background = 'radial-gradient(' + rgba(c, .9) + ',' + rgba(c, .25) + ' 45%,transparent 70%)';
  var punch = 1 - ease(l / 0.18);
  im.style.transform = 'rotate(' + (-9 + l * 4) + 'deg) scale(' + (1.02 + 0.22 * punch + l * 0.06) + ')';
  im.style.filter = 'drop-shadow(0 40px 50px rgba(0,0,0,.6)) blur(' + (punch * 6).toFixed(1) + 'px)';
  $('streak').style.left = (-400 + ease(l / 0.4) * 1900) + 'px';
}

// Сцена 2 (8–11,5 с): ряды карточек в наклоне, как «Paid» у Wise; новая въезжает справа, вдоль края бежит световая линия.
var deck = $('deck');
var cards = V.items.map(function (it) {
  var d = document.createElement('div'); d.className = 'card';
  d.innerHTML = '<div class="clip"><div class="gl"></div><div class="sh"></div></div><img src="work/' + it.img + '"><div class="p">' + usd(it.cents) + '</div>';
  deck.appendChild(d); return d;
});
var C0 = 8.0, CSTEP = 0.48;
function drawCards(t) {
  var on = t >= C0 && t < 11.5; $('stage').style.display = on ? 'block' : 'none'; if (!on) return;
  var k = (t - C0) / 3.5, collapse = ease((t - 11.3) / 0.2);
  // Камера: медленный наезд и доворот всей колоды.
  var n = clamp((t - C0) / CSTEP, 0, cards.length - 1), scroll = Math.max(0, n - 1.6) * 250;
  deck.style.transform = 'translateY(' + (60 - scroll) + 'px) rotateX(' + (24 - k * 6) + 'deg) rotateZ(' + (-7 + k * 3) + 'deg) scale(' + (0.98 + k * 0.05) + ')';
  for (var i = 0; i < cards.length; i++) {
    var d = cards[i], src = 'work/' + V.items[i].img, c = tints[src] || T.def;
    d.querySelector('.gl').style.background = rgba(c, .9);
    var p = (t - C0 - i * CSTEP) / 0.4;
    if (p < 0) { d.style.opacity = 0; continue; }
    var e = back(p), y = 600 + i * 250, sy = y + 60 - scroll;
    d.style.top = y + 'px'; d.style.zIndex = 10 + i;
    d.style.transform = 'translateX(' + ((1 - e) * 1100) + 'px) translateZ(' + (collapse * -600) + 'px)';
    d.style.filter = 'blur(' + ((1 - ease(p)) * 10).toFixed(1) + 'px)';
    d.style.opacity = 1 - collapse;
    d.querySelector('.sh').style.left = (-300 + ease((p - 0.8) / 1.2) * 1300) + 'px';
  }
}

// Сцена 3 (11,5–14 с): итог считается на стеклянной плите, плита чуть повёрнута и доворачивается к зрителю.
function drawTotal(t) {
  var on = t >= 11.5 && t < 14.5; $('tot').style.display = on ? 'block' : 'none'; if (!on) return;
  var k = (t - 11.5) / 3, a = back((t - 11.5) / 0.45);
  $('plate').style.transform = 'translateY(' + ((1 - a) * 300) + 'px) rotateX(' + (14 - k * 10) + 'deg) rotateY(' + (-12 + k * 9) + 'deg)';
  $('plate').style.opacity = clamp((t - 11.5) / 0.15, 0, 1);
  var fee = V.total - V.net, down = inout((t - 12.5) / 0.7);
  var val = t < 12.5 ? Math.round(V.total * ease((t - 11.6) / 0.7)) : Math.round(V.total - fee * down);
  $('big').innerHTML = '<span style="font-size:.6em">≈</span> ' + usd(val);
  var bw = $('big').scrollWidth; $('big').style.transform = 'scale(' + Math.min(1, 900 / bw) + ')';
  // Комиссия и пометка — на своих карточках, въезжают справа, как карточки цен.
  $('fc').innerHTML = '<b>−' + usd(fee) + '</b><span>комиссия Steam</span>';
  $('nc').textContent = 'пример · цены Steam на ' + V.date;
  [['fc', 12.35], ['nc', 12.8]].forEach(function (c) {
    var p = (t - c[1]) / 0.4, e = back(p), el = $(c[0]);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.transform = 'translateX(' + ((1 - e) * 1100).toFixed(1) + 'px) rotate(' + ((1 - ease(p)) * -4).toFixed(2) + 'deg)';
    el.style.filter = p < 1 ? 'blur(' + ((1 - ease(p)) * 10).toFixed(1) + 'px)' : 'none';
  });
  $('psh').style.left = (-300 + ease((t - 12.0) / 0.8) * 1500) + 'px';
}

// ?preview — черновик без записи экрана: 0–1,5 с скины, затем сразу карточки и итог (8–14 с).
var PREVIEW = /preview/.test(location.search);
// Экран бота: отрезки записей (кадры work/frames/<клип>/NNNNN.jpg, 30 к/с), камера по ключам [с от начала отрезка, x, y, зум] в пикселях записи 1080×2338.
var SEGS = [
  { t0: 1.5, t1: 3.9, clip: 'connect', c0: 0.5, n: 130, k: [[0, 540, 470, 1.12], [1.5, 540, 650, 1.12], [2.4, 540, 700, 1.05]] },
  { t0: 3.9, t1: 6.0, clip: 'invsteam', c0: 0.3, n: 401, k: [[0, 540, 1150, 1.12], [2.1, 540, 1450, 1.0]] },
  { t0: 6.0, t1: 8.0, clip: 'invsteam', c0: 5.4, n: 401, k: [[0, 540, 1350, 1.0], [0.5, 540, 600, 1.15], [2.0, 540, 520, 1.35]] },
  { t0: 14.5, t1: 17.5, clip: 'invsteam', c0: 8.2, n: 401, k: [[0, 540, 1350, 1.08], [1.6, 540, 1450, 1.15], [2.2, 540, 1850, 1.1], [3, 540, 1900, 1.1]] }
];
function keyAt(k, x) {
  if (x <= k[0][0]) return k[0]; for (var i = 1; i < k.length; i++) if (x <= k[i][0]) { var a = k[i - 1], b = k[i], u = inout((x - a[0]) / (b[0] - a[0])); return [x, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u]; }
  return k[k.length - 1];
}
function drawPhone(t) {
  var sg = null; for (var i = 0; i < SEGS.length; i++) if (t >= SEGS[i].t0 && t < SEGS[i].t1) sg = SEGS[i];
  $('ph').style.display = sg ? 'block' : 'none'; if (!sg) return null;
  var x = t - sg.t0, f = Math.max(1, Math.min(sg.n, Math.round((sg.c0 + x) * 30) + 1));
  var src = 'work/frames/' + sg.clip + '/' + ('0000' + f).slice(-5) + '.jpg', im = $('phimg');
  var c = keyAt(sg.k, x), s = 780 * c[3] / 1080;
  var L = clamp(390 - c[1] * s, 780 - 1080 * s, 0), Tp = clamp(345 - c[2] * s, 690 - 2338 * s, 0);
  im.style.width = '1080px'; im.style.transform = 'translate(' + L.toFixed(1) + 'px,' + Tp.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
  var e = back(x / 0.3); $('ph').style.transform = 'scale(' + (0.92 + 0.08 * e).toFixed(3) + ')';
  if (im.getAttribute('src') !== src) { im.src = src; return im.decode().catch(function () {}); }
  return null;
}
// Финал (17,5–20 с): три карточки въезжают по очереди; в конце всё гаснет в фон — ролик закольцовывается.
function drawFin(t) {
  var on = t >= 17.5; $('fin').style.display = on ? 'block' : 'none'; if (!on) return;
  [['f1', 17.55], ['f2', 17.85], ['f3', 18.15]].forEach(function (c) {
    var p = (t - c[1]) / 0.4, e = back(p), el = $(c[0]);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.transform = 'translateX(' + ((1 - e) * 1100).toFixed(1) + 'px) rotate(' + ((1 - ease(p)) * -4).toFixed(2) + 'deg)';
    el.style.filter = p < 1 ? 'blur(' + ((1 - ease(p)) * 10).toFixed(1) + 'px)' : 'none';
  });
  $('fin').style.opacity = 1 - ease((t - 19.55) / 0.45);
}

// Монтаж: на склейках «хлыст» (резкий сдвиг с размытием) и вспышка; на каждую долю такта — лёгкий удар камеры.
var CUTS = [1.5, 3.9, 6, 8, 11.5, 14.5, 17.5], WH = 0.16;
function drawCam(t) {
  var x = 0, bl = 0, fl = 0;
  for (var i = 0; i < CUTS.length; i++) {
    var dt = t - CUTS[i];
    if (dt > -WH && dt < 0) { var a = ease((dt + WH) / WH); x = -a * 620; bl = a * 26; }
    if (dt >= 0 && dt < WH) { var b = 1 - ease(dt / WH); x = b * 620; bl = b * 26; fl = Math.max(fl, b); }
  }
  var bt = t % 0.48, pulse = 1 + 0.018 * Math.exp(-bt * 9);
  var dr = Math.sin(t * 0.7) * 6;
  $('fxi').style.transform = 'translate(' + (x + dr).toFixed(1) + 'px,0) scale(' + pulse.toFixed(4) + ')';
  $('fxi').style.filter = bl > 0.3 ? 'blur(' + bl.toFixed(1) + 'px)' : 'none';
  $('flash').style.opacity = (fl * 0.45).toFixed(3);
}
window.frameAt = function (t) {
  if (PREVIEW && t >= 1.5) t = t - 1.5 + 8;
  var wait = drawPhone(t); drawFin(t);
  drawBg(t); drawHero(t); drawCards(t); drawTotal(t); drawCam(t); word(t); drawHook(t); drawMb(t); drawGrain(t);
  return wait;
};
window.frameAt(0);
</script></body></html>
