name: video-voice
# Озвучка для роликов TikTok: запускается вручную, результат — артефакт (mp3 + тайминги слов + картинки).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/video/**']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/video
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U edge-tts piper-tts
      - run: python .github/video/voice.py
      # Результат кладём в отдельную ветку video-assets (её удобно забрать git'ом).
      - name: Сохранить в ветку video-assets
        run: |
          cd out
          git init -q -b video-assets
          git config user.name "video-bot"; git config user.email "video-bot@users.noreply.github.com"
          git add -A && git commit -qm "voice ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-assets
