<!doctype html>
<!-- Ролик «Чек за $0» (поддержка автора, свой каркас): объёмный нож → «сколько стоит узнать его цену?» → печатается чек: каждая функция бота — $0,
     ИТОГО $0, штамп «БЕСПЛАТНО» → настоящий экран доната (25/50/100/250/500 = DONATE_AMOUNTS) → «звёзды ничего не открывают» (текст самого бота).
     Монтаж — engine/kit.js, запись work/don/clips/don (касания: «Поддержать проект» 1.96, «50» 6.02). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="engine/kit.css">
<style>
.top{font-size:76px}
#slot{position:absolute;left:60px;width:960px;top:556px;height:26px;border-radius:13px;background:linear-gradient(180deg,#000,rgba(var(--deep),1));border:2px solid rgba(var(--edge),.4);box-shadow:0 10px 30px rgba(0,0,0,.7);z-index:5}
#rw{position:absolute;left:90px;top:575px;width:900px;height:740px;overflow:hidden}
#rc{position:absolute;left:0;top:0;width:900px;border-radius:0 0 26px 26px;padding:24px 40px 40px;transform-origin:50% 0;
  background:linear-gradient(170deg,rgba(var(--hi),.32),rgba(var(--mid),.75) 40%,rgba(var(--deep),.95));border:2px solid rgba(var(--edge),.38);border-top:0;
  box-shadow:0 40px 80px rgba(0,0,0,.55),inset 0 -2px 0 rgba(255,255,255,.12);
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent calc(100% - 22px)),conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0);
  -webkit-mask-size:100% 100%,44px 22px;-webkit-mask-position:0 0,0 100%;-webkit-mask-repeat:no-repeat,repeat-x}
#rc .hd{position:relative;height:90px;display:flex;align-items:center;font-weight:900;font-size:52px;letter-spacing:3px;color:rgba(255,255,255,.85)}
.ln{height:80px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:52px;letter-spacing:-1px;white-space:nowrap}
.ln .ic{width:64px;height:64px;object-fit:contain;flex:none}
.ln .dt{flex:1;height:2px;border-bottom:4px dotted rgba(255,255,255,.35);margin-top:20px}
.ln .v{color:#FFD23F;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(255,210,63,.5)}
.tot{position:relative;height:160px;display:flex;align-items:center;justify-content:space-between;border-top:4px solid rgba(255,255,255,.3);margin-top:10px;font-weight:900}
.tot .l{font-size:72px;letter-spacing:4px}.tot .v{font-size:130px;color:#FFD23F;text-shadow:0 0 40px rgba(255,210,63,.6);letter-spacing:-4px}
#stamp{position:absolute;right:14px;top:22px;padding:4px 20px;border:7px solid #FFD23F;border-radius:18px;color:#FFD23F;font-weight:900;font-size:42px;letter-spacing:4px;
  transform:rotate(-8deg);text-shadow:0 0 24px rgba(255,210,63,.6);box-shadow:0 0 30px rgba(255,210,63,.35),inset 0 0 20px rgba(255,210,63,.25);opacity:0}
.cta{font-size:64px}
</style></head><body>
<script src="work/vdata.js"></script>
<script src="engine/kit.js"></script>
<script>
var knife = window.V.items.filter(function (x) { return /^★/.test(x.name); })[0]; if (!knife) throw new Error('нет ножа в work/vdata.js');
var SVGSTAR = '<svg viewBox="0 0 24 24" class="star"><path d="M12 1.8l3.1 6.4 7 1-5.1 4.9 1.2 7L12 17.8 5.8 21.1 7 14.1 1.9 9.2l7-1z" fill="#FFD23F"/></svg>';
var LINES = [[2.8, 'Цена ножа в Steam'], [4.0, 'На руки после комиссии'], [5.2, 'Уведомление о цене'], [6.4, 'Поиск по-русски'], [7.6, 'Продажи за сутки']];
var E = {};
KIT.run({
  base: 'work/', dur: 25, beat: 0.6, pulse: 0.012, whip: { dist: 480, blur: 20, flash: 0.35 },
  cuts: [2.4, 12.6, 18.3, 21.6],
  punches: LINES.map(function (l) { return [l[0], 0.03]; }).concat([[9.0, 0.08], [9.5, 0.04], [18.8, 0.03]]),
  mb: [[3.2, 'r', 446, 2, 1], [8.0, 'off'], [21.9, 'c', 446, 0, 1], [24.6, 'off']],
  segs: [{ base: 'work/don/', t0: 13.0, t1: 18.3, clip: 'don', c0: 1.0, n: 260, rect: [150, 600, 680, 840], tilt: [14, 0],
    k: [[0, 540, 1300, 1.0], [1.2, 540, 1600, 1.0], [2.6, 540, 1450, 1.0], [5.3, 540, 1600, 1.0]] }],
  pops: [{ at: 13.96, box: [13, 585.4, 364, 83.6], text: 'Поддержать проект', size: 62, to: [475, 1000] },
         { at: 18.0, box: [200, 587.5, 176, 58], text: SVGSTAR + '50', size: 150, to: [475, 1000] }],
  init: function (K) {
    E.halo = K.el('', ''); E.halo.style.cssText = 'position:absolute;left:-60px;top:560px;width:1200px;height:800px;border-radius:50%;filter:blur(90px);background:radial-gradient(' + K.rgba(K.vivid(knife.tint), .8) + ',' + K.rgba(K.vivid(knife.tint), .2) + ' 45%,transparent 70%)';
    E.knife = K.gun3d(K.B + knife.img, [130, 650, 820, 460], 20, 3.2);
    E.tops = [[0.15, 2.3, 'Сколько стоит узнать<br>цену <span class="g">ножа</span>?'], [2.5, 9.45, 'Чек за всё,<br>что делает бот'], [9.6, 12.5, 'Бот <span class="g">бесплатный</span>.<br>Для всех.'],
      [12.7, 15.2, 'Ещё → <span class="g">Поддержать проект</span>'], [15.3, 18.2, 'Звёзды Telegram:<br><span class="g">25 · 50 · 100 · 250 · 500</span>'],
      [18.4, 21.45, 'Звёзды <span class="g">ничего</span><br>не открывают'], [21.8, 24.6, 'Ценолов — бесплатный<br>бот цен CS2']]
      .map(function (x) { var p = K.plate(x[2], [70, 210, 940, 220]); p.classList.add('top'); return { el: p, a: x[0], b: x[1] }; });
    E.slot = K.el('', ''); E.slot.id = 'slot';
    E.rw = K.el('', ''); E.rw.id = 'rw';
    var h = '<div class="hd">ЦЕНОЛОВ · ЧЕК<div id="stamp">БЕСПЛАТНО</div></div>';
    LINES.forEach(function (l, i) { h += '<div class="ln" data-i="' + i + '">' + (i === 0 ? '<img class="ic" id="kic" src="' + K.B + knife.img + '">' : '') + '<span>' + l[1] + '</span><span class="dt"></span><span class="v">$0</span></div>'; });
    h += '<div class="tot"><span class="l">ИТОГО</span><span class="v">$0</span></div>';
    h += '<div class="ln" data-i="5"><span>Звёзды Telegram</span><span class="dt"></span><span class="v">по желанию</span></div>';
    E.rc = K.el(h, '', E.rw); E.rc.id = 'rc';
    E.lines = [].slice.call(E.rc.querySelectorAll('.ln')); E.tot = E.rc.querySelector('.tot'); E.stamp = E.rc.querySelector('#stamp');
    E.c1 = K.plate('Помог бот — можешь<br>поддержать <span class="g">звёздами</span>.', [70, 720, 810, 250]); E.c1.classList.add('cta');
    E.c2 = K.plate('Не помог —<br>пользуйся <span class="g">бесплатно</span>.', [70, 1010, 810, 250]); E.c2.classList.add('cta');
  },
  scene: function (t, K) {
    E.tops.forEach(function (p) { K.slam(p.el, t, p.a, 'z', p.b, 'l'); });

    // Нож: крупно в крючке, на 2,4–2,8 садится значком в первую строку чека (там его заменяет картинка в строке).
    var fly = K.ease((t - 2.4) / 0.4), kOn = t < 2.8 || t >= 24.55;
    var kop = t >= 24.55 ? K.ease((t - 24.55) / 0.45) : 1;
    E.knife.pose(K.tr, { rz: -10, ry: Math.sin(K.tr * 0.9) * 30, rx: 12, s: 1 - 0.9 * fly, tx: -fly * 330, ty: -fly * 190, op: kOn ? kop : 0 });
    E.halo.style.opacity = ((kOn ? kop : 0) * (1 - fly) * 0.7).toFixed(2);

    // Чек: печатается из щели, по строке на шаг; уезжает вверх на 12,6, возвращается на 18,3 со строкой «Звёзды Telegram — по желанию».
    var on = (t >= 2.4 && t < 12.9) || (t >= 18.3 && t < 21.8);
    E.rw.style.display = E.slot.style.display = on ? 'block' : 'none';
    if (on) {
      E.lines[5].style.display = t < 18.8 ? 'none' : 'flex'; E.tot.style.display = t >= 9.0 ? 'flex' : 'none';
      var n = LINES.filter(function (l) { return t >= l[0]; }).length, H = 24 + 90 + n * 80 + (t >= 9.0 ? 170 : 0) + (t >= 18.8 ? 80 : 0) + 40;
      var full = E.rc.offsetHeight, back2 = t >= 18.3, sc = back2 ? 0.9 : 1;
      if (back2) H = full;
      // Бумага выходит из щели верхом вперёд: видна верхняя часть высотой H.
      var lift = back2 ? (1 - K.back((t - 18.3) / 0.5)) * -900 : t >= 12.6 ? K.ease((t - 12.6) / 0.3) * -900 : 0;
      E.rw.style.height = (t < 2.5 ? 0 : Math.min(740, H * sc)).toFixed(1) + 'px';
      E.rc.style.transform = 'translateY(' + lift.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
      E.rc.style.filter = t >= 12.6 && t < 12.9 ? 'blur(' + (K.ease((t - 12.6) / 0.3) * 14).toFixed(1) + 'px)' : 'none';
      E.rw.style.opacity = t >= 21.6 ? 1 - K.ease((t - 21.6) / 0.2) : 1;
      E.lines.forEach(function (ln, i) {
        var at = i < 5 ? LINES[i][0] : 18.8, p = K.clamp((t - at) / 0.25, 0, 1);
        ln.style.clipPath = 'inset(0 ' + ((1 - p) * 100).toFixed(1) + '% 0 0)';
        ln.style.display = i === 5 && t < 18.8 ? 'none' : 'flex';
      });
      E.rc.querySelector('#kic').style.opacity = t >= 2.75 ? 1 : 0;
      var tp = K.clamp((t - 9.0) / 0.3, 0, 1); E.tot.style.opacity = tp; E.tot.style.display = t >= 9.0 ? 'flex' : 'none';
      E.tot.style.transform = 'scale(' + (1.2 - 0.2 * K.back(tp)).toFixed(3) + ')';
      var sp = K.clamp((t - 9.5) / 0.3, 0, 1); E.stamp.style.opacity = sp;
      E.stamp.style.transform = 'rotate(-8deg) scale(' + (1.4 - 0.4 * K.back(sp)).toFixed(3) + ')';
    }

    // Призыв.
    K.slam(E.c1, t, 21.7, 'r', 24.6, 'l'); K.slam(E.c2, t, 22.2, 'l', 24.6, 'r');
  }
});
</script></body></html>
