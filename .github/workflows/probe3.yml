name: probe3
on: { push: { branches: [probe3] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const r = await fetch('https://steamcommunity.com/inventory/76561198084749846/730/2?l=english&count=200', { headers: { 'User-Agent': 'cs2-market-bot-collector/1.0' } });
          console.log('####', r.status);
          const j = await r.json().catch(() => null);
          if (j) {
            console.log('KEYS', Object.keys(j).join(','));
            console.log('PROPS', JSON.stringify(j.asset_properties?.slice(0, 3)).slice(0, 1200));
            const withSt = (j.descriptions || []).filter((d) => JSON.stringify(d.descriptions || []).match(/Sticker|Charm|sticker_info|keychain/));
            console.log('STICK', withSt.length, JSON.stringify(withSt[0]?.descriptions).slice(0, 1500));
            const dop = (j.descriptions || []).find((d) => /Doppler/.test(d.market_hash_name || ''));
            console.log('DOP', JSON.stringify(dop).slice(0, 1500));
            console.log('DESC0', JSON.stringify((j.descriptions || []).find((d) => /\(/.test(d.market_hash_name || ''))).slice(0, 2000));
          }
          JS
          node p.mjs
