<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>CS2 Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0f1115);--bg2:var(--tg-theme-secondary_bg_color,#171a21);
  --card:var(--tg-theme-section_bg_color,#1c2029);--text:var(--tg-theme-text_color,#eef1f6);
  --hint:var(--tg-theme-hint_color,#8a93a6);--link:var(--tg-theme-link_color,#6aa9ff);
  --accent:var(--tg-theme-button_color,#5b8cff);--accent-t:var(--tg-theme-button_text_color,#fff);
  --sep:color-mix(in srgb,var(--hint) 22%,transparent);
  --green:#2fbf71;--red:#ef5350;--amber:#f2a93b;--violet:#8b6cff;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg2);padding:calc(12px + var(--safe-top)) 16px 8px;display:flex;align-items:center;gap:10px}
:root{--safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hint)}
.dot.ok{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 20%,transparent)}
.dot.bad{background:var(--red)}
.dot.warn{background:var(--amber)}
.dot{cursor:pointer}
.wrap{padding:0 12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px}
.stat .l{color:var(--hint);font-size:12.5px}
.stat .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.stat .s{color:var(--hint);font-size:12px;margin-top:2px}
.sec{color:var(--hint);font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:16px 6px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a{color:var(--link);text-transform:none;letter-spacing:0;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.row:active{opacity:.75}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--hint);font-size:13px;margin-top:2px}
.row .r{text-align:right;white-space:nowrap}
.row .r .big{font-weight:700}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--accent) 16%,transparent);flex:none}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--hint)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;vertical-align:1px}
.b-high{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.b-medium{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.b-low{background:color-mix(in srgb,var(--hint) 22%,transparent);color:var(--hint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);color:var(--text);font-size:14px;border:0}
.chip.on{background:var(--accent);color:var(--accent-t)}
.search{display:flex;gap:8px;margin-bottom:10px}
input,select{width:100%;background:var(--card);border:1px solid var(--sep);color:var(--text);border-radius:12px;padding:12px 13px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:13px;font-weight:600;background:var(--accent);color:var(--accent-t);margin-top:10px}
.btn.sec2{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--link)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.empty{text-align:center;color:var(--hint);padding:30px 18px}
.empty .e{font-size:38px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--sep)}
.kv:last-child{border-bottom:0}.kv .k{color:var(--hint)}.kv .v{text-align:right;font-weight:500}
.note{color:var(--hint);font-size:12.5px;margin:6px 4px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--sep);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px 0}
.tab .t{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--accent)}.tab.on .t{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:calc(92vh - var(--safe-top));overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:4px auto 12px}
.sheet h2{font-size:18px;margin:0 0 4px;line-height:1.25}
.sheet .sub{color:var(--hint);font-size:13px;margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--hint);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.big-num{font-size:28px;font-weight:800;letter-spacing:-.5px}
.seg{display:flex;background:var(--card);border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;font-size:14px;color:var(--hint)}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),color-mix(in srgb,var(--card) 70%,var(--hint)),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
label.f{display:block;margin:10px 0 0}label.f span{display:block;color:var(--hint);font-size:13px;margin:0 0 5px 3px}
.sw{position:relative;width:48px;height:29px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw b{position:absolute;inset:0;border-radius:999px;background:var(--sep);transition:.2s}
.sw b:after{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+b{background:var(--green)}.sw input:checked+b:after{left:22px}
.list-s .row{cursor:default}
.ic.pic{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--card) 60%,var(--bg)))}
.ic img{width:36px;height:36px;object-fit:contain}
.hero-img{display:block;margin:0 auto 6px;width:150px;height:110px;object-fit:contain}
.tool{display:flex;gap:8px;margin:2px 0 10px}
.tool .btn{margin:0;padding:10px 12px;font-size:15px}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--hint);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.row.sel .cb{background:var(--red);border-color:var(--red)}
.editbar{position:sticky;top:calc(56px + var(--safe-top));z-index:6;display:flex;gap:8px;align-items:center;padding:8px 0 10px;background:var(--bg2)}
.editbar .btn{margin:0;padding:9px 12px;font-size:14px;flex:none;width:auto}
.rc{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.rc:active{opacity:.8}
.rc .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rc .hd .n{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .hd .c{font-size:12px;color:var(--hint);font-weight:400}
.flow{display:grid;grid-template-columns:1fr 16px 1fr 16px 1fr;align-items:center;gap:4px;text-align:center}
.flow .st{background:color-mix(in srgb,var(--hint) 12%,transparent);border-radius:10px;padding:7px 4px}
.flow .st.get{background:color-mix(in srgb,var(--green) 18%,transparent)}
.flow .l{font-size:11px;color:var(--hint)}
.flow .mk{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .v{font-weight:800;font-size:15px;white-space:nowrap}
.flow .ar{color:var(--hint);font-weight:700}
.rc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px}
.info p{margin:0 0 8px}.info b{font-weight:700}
.act{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.a-buy{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.a-sell{background:color-mix(in srgb,var(--violet) 24%,transparent);color:var(--violet)}
.a-avoid{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.a-hold,.a-nodata{background:color-mix(in srgb,var(--hint) 18%,transparent);color:var(--hint)}
.verdict{border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.verdict .vi{font-size:26px;line-height:1}
.verdict .vt{font-weight:800;font-size:18px}
.verdict .vr{font-size:14px;margin-top:3px;opacity:.9}
.v-buy{background:color-mix(in srgb,var(--green) 16%,var(--card))}
.v-sell{background:color-mix(in srgb,var(--violet) 18%,var(--card))}
.v-avoid{background:color-mix(in srgb,var(--red) 14%,var(--card))}
.v-hold,.v-nodata{background:var(--card)}
</style>
</head>
<body>
<div class="top"><h1 id="title">CS2 Market</h1><span class="dot" id="dot"></span></div>
<div class="wrap" id="view"></div>
<nav class="tabs" id="tabs">
  <button class="tab on" data-t="home"><span class="t">🏠</span>Главная</button>
  <button class="tab" data-t="deals"><span class="t">💡</span>Идеи</button>
  <button class="tab" data-t="market"><span class="t">📊</span>Рынок</button>
  <button class="tab" data-t="inv"><span class="t">🎒</span>Инвентарь</button>
  <button class="tab" data-t="more"><span class="t">⚙️</span>Ещё</button>
</nav>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sc"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {} }
// Полноэкранный режим Telegram: сверху часы и кнопки Telegram — сдвигаем шапку на их высоту.
function applySafeTop() {
  if (!tg) return;
  var a = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {};
  var top = (a.top || 0) + (c.top || 0);
  var v = top ? top + 'px' : (tg.isFullscreen ? 'calc(env(safe-area-inset-top) + 48px)' : '');
  if (v) document.documentElement.style.setProperty('--safe-top', v); else document.documentElement.style.removeProperty('--safe-top');
}
if (tg && tg.onEvent) { ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged'].forEach(function (ev) { try { tg.onEvent(ev, applySafeTop); } catch (e) {} }); }
applySafeTop();
var INIT = tg ? tg.initData : '';
var $ = function (s, r) { return (r || document).querySelector(s); };
var view = $('#view');
var state = { tab: 'home', ideas: 'recs', mkAct: 'all', edit: false, sel: {}, dealOrder: 'spread', dealSrc: 'all', mkCat: 'all', cache: {} };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uah(k, sign) {
  if (k == null || isNaN(k)) return '—';
  var neg = k < 0, a = Math.abs(Math.round(k)), w = Math.floor(a / 100), f = String(a % 100).padStart(2, '0');
  var s = String(w).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + f + ' ₴';
  return (neg ? '−' : (sign && k > 0 ? '+' : '')) + s;
}
function uahShort(k) { if (k == null) return '—'; var v = k / 100; return (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('ru-RU') : v.toFixed(2).replace('.', ',')) + ' ₴'; }
function pct(bp, sign) { if (bp == null) return '—'; var v = bp / 100; return (v > 0 && sign !== false ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',') + '%'; }
function cls(v) { return v == null ? 'mut' : v > 0 ? 'pos' : v < 0 ? 'neg' : 'mut'; }
function ago(t) { if (!t) return 'нет данных'; var d = Math.max(0, Date.now() / 1000 - t); if (d < 60) return 'только что'; if (d < 3600) return Math.floor(d / 60) + ' мин назад'; if (d < 86400) return Math.floor(d / 3600) + ' ч назад'; return Math.floor(d / 86400) + ' дн назад'; }
function haptic(t) { try { tg && tg.HapticFeedback && (t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} }
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 2400); }
function openLink(u) { if (!u) return; if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); }
var ICON = { case: '📦', capsule: '💊', sticker: '🏷️', knife: '🔪', gloves: '🧤', weapon: '🔫', agent: '🕴️', patch: '🪡', other: '🎲', key: '🔑', graffiti: '🎨', music_kit: '🎵', pin: '📌' };
var SRC = { steam: 'Steam', skinport: 'Skinport', csfloat: 'CSFloat', nbu: 'Курсы НБУ', collector: 'Сборщик GitHub' };
var PRI = { high: 'высокий', medium: 'средний', low: 'низкий' };
function pic(img, emoji, big) {
  if (!img) return '<div class="ic">' + (emoji || '🎲') + '</div>';
  return '<div class="ic pic"><img src="' + esc(img) + '" loading="lazy" alt="" onerror="this.parentNode.classList.remove(\'pic\');this.parentNode.textContent=\'' + (emoji || '🎲') + '\'"></div>';
}
var ACT_ORDER = { buy: 0, sell: 1, avoid: 2, hold: 3, nodata: 4 };
var ACT_LABEL = { buy: '🟢 Купить', sell: '💜 Продать', avoid: '🔴 Дорого', hold: '⏸ Ждать', nodata: '⏳ Мало данных' };
var ACT_ICON = { buy: '🟢', sell: '💜', avoid: '🔴', hold: '⏸️', nodata: '⏳' };
function actPill(a) { return a ? '<span class="act a-' + a.action + '">' + esc(a.title) + '</span>' : ''; }
function verdict(a) {
  if (!a) return '';
  return '<div class="verdict v-' + a.action + '"><div class="vi">' + ACT_ICON[a.action] + '</div><div><div class="vt">' + esc(a.title) + '</div><div class="vr">' + esc(a.reason) + '</div></div></div>';
}
var LIQ = { high: 'высокая', medium: 'средняя', low: 'низкая', unknown: 'нет данных' };

function api(path, opt) {
  opt = opt || {};
  return fetch('/app/api/' + path, {
    method: opt.method || 'GET',
    headers: { 'X-Init-Data': INIT, 'Content-Type': 'application/json' },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  }).then(function (r) {
    return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }).then(function (j) {
      if (r.status === 403) throw new Error('Нет доступа. Открой приложение кнопкой в своём боте.');
      if (!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}
function loading(n) { var s = ''; for (var i = 0; i < (n || 4); i++) s += '<div class="skel"></div>'; view.innerHTML = s; }
function fail(e) { view.innerHTML = '<div class="empty"><div class="e">⚠️</div>' + esc(e.message || e) + '<br><br><button class="btn sec2" id="retry">Повторить</button></div>'; $('#retry').onclick = function () { go(state.tab); }; }

// ---------- Шторка ----------
var sheetStack = 0;
function sheet(html) {
  $('#sc').innerHTML = html; $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('on'); $('#sbg').classList.add('on'); sheetStack = 1;
  if (tg && tg.BackButton) tg.BackButton.show();
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#sbg').classList.remove('on'); sheetStack = 0;
  if (tg && tg.BackButton) tg.BackButton.hide();
  var f = window._onSheetClose; window._onSheetClose = null; if (f) f();
}
$('#sbg').onclick = closeSheet;
if (tg && tg.BackButton) tg.BackButton.onClick(closeSheet);

// ---------- Навигация ----------
var TITLES = { home: 'CS2 Market', deals: 'Что купить', market: 'Рынок', inv: 'Инвентарь', more: 'Ещё' };
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
  b.onclick = function () { haptic(); go(b.getAttribute('data-t')); };
});
function go(t) {
  state.tab = t; closeSheet();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
  $('#title').textContent = TITLES[t];
  window.scrollTo(0, 0);
  ({ home: home, deals: deals, market: market, inv: inventory, more: more })[t]();
}

// ---------- Состояние: зелёный — всё работает; жёлтый — работает, но Steam/Skinport временно ограничены; красный — бот стоит ----------
function health(s) {
  var by = {}; s.sources.forEach(function (x) { by[x.source] = x; });
  var col = by.collector, now = Date.now() / 1000;
  var collectorOk = col && col.lastOk && now - col.lastOk < 45 * 60;
  if (!s.cronAlive || !collectorOk) return { cls: 'bad', icon: '🔴', title: 'Цены не обновляются', note: !s.cronAlive ? 'Планировщик бота не запускался больше 5 минут.' : 'Сборщик цен давно не присылал данные. Владелец бота получит уведомление.' };
  var steam = by.steam, sp = by.skinport;
  if (steam && steam.status !== 'ok') return { cls: 'warn', icon: '🟡', title: 'Работает, но Steam ограничил запросы', note: 'Живые цены Steam обновятся, когда Steam пустит (обычно через 10–60 мин). Подсказки пока считаются по суточному прайсу Steam.' };
  if (sp && sp.status !== 'ok') return { cls: 'warn', icon: '🟡', title: 'Работает, но Skinport отвечает с ошибками', note: 'Остальные площадки обновляются.' };
  return { cls: 'ok', icon: '🟢', title: 'Всё работает', note: '' };
}
$('#dot').onclick = function () {
  var hs = state.health; if (!hs) return go('home');
  sheet('<h2>' + hs.icon + ' ' + esc(hs.title) + '</h2>' + (hs.note ? '<div class="card">' + esc(hs.note) + '</div>' : '') +
    '<div class="note">🟢 — всё работает · 🟡 — работает, но один источник временно ограничен · 🔴 — цены не обновляются.</div>');
};

// ---------- Главная ----------
function home() {
  loading(5);
  api('summary').then(function (s) {
    var hs = health(s);
    state.health = hs;
    $('#dot').className = 'dot ' + hs.cls;
    var h = '';
    h += '<div class="card" style="display:flex;align-items:center;gap:12px"><div class="ic">' + hs.icon + '</div><div style="flex:1"><div style="font-weight:600">' + hs.title +

function bindSearch(input, out, onPick, mark) {

function chart(series, days, avg) {
  var W = 340, H = 170, L = 44, R = 6, T = 8, B = 22;
  var defs = [['steamLow', 'Steam объявление', '#8b6cff'], ['steamMed', 'Steam медиана', '#2fbf71'], ['skinport', 'Skinport', '#f2a93b']];
  var all = []; defs.forEach(function (d) { (series[d[0]] || []).forEach(function (p) { if (p.v != null) all.push(p.v); }); });
  if (all.length < 2) return '<div class="empty" style="padding:22px">📉 История ещё копится.<br><span style="font-size:13px">Точки появляются при каждом сборе цен.</span></div>';
  var now = Date.now() / 1000, from = now - days * 86400;
  if (avg) all.push(avg);
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all); if (mn === mx) { mn -= 100; mx += 100; }
  var pad = (mx - mn) * .1; mn = Math.max(0, mn - pad); mx += pad;
  function x(t) { return L + (t - from) / (now - from) * (W - L - R); }
  function y(v) { return T + (1 - (v - mn) / (mx - mn)) * (H - T - B); }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
  for (var i = 0; i <= 3; i++) { var v = mn + (mx - mn) * i / 3; s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="currentColor" stroke-opacity=".1"/><text x="' + (L - 5) + '" y="' + (y(v) + 3).toFixed(1) + '" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".55">' + Math.round(v / 100) + '</text>'; }
  for (var j = 0; j <= 3; j++) { var t = from + (now - from) * j / 3, dt = new Date(t * 1000); s += '<text x="' + x(t).toFixed(1) + '" y="' + (H - 6) + '" font-size="9" text-anchor="middle" fill="currentColor" fill-opacity=".55">' + String(dt.getDate()).padStart(2, '0') + '.' + String(dt.getMonth() + 1).padStart(2, '0') + '</text>'; }
  if (avg) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(avg).toFixed(1) + '" y2="' + y(avg).toFixed(1) + '" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="' + (W - R) + '" y="' + (y(avg) - 4).toFixed(1) + '" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".7">средняя 7 дн</text>';
  var gap = Math.max(3 * 3600, days * 86400 / 40);
  defs.forEach(function (d) {
    var pts = (series[d[0]] || []).filter(function (p) { return p.v != null && p.t >= from; }), seg = [], last = null;
    function flush() { if (seg.length > 1) s += '<polyline fill="none" stroke="' + d[2] + '" stroke-width="2" stroke-linejoin="round" points="' + seg.join(' ') + '"/>'; else if (seg.length === 1) { var c = seg[0].split(','); s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="2.2" fill="' + d[2] + '"/>'; } seg = []; }
    pts.forEach(function (p) { if (last != null && p.t - last > gap) flush(); seg.push(x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)); last = p.t; });
    flush();
  });
  s += '</svg><div class="legend">' + defs.filter(function (d) { return (series[d[0]] || []).length; }).map(function (d) { return '<span><i style="background:' + d[2] + '"></i>' + d[1] + '</span>'; }).join('') + '</div>';
  return s + '<div class="note" style="margin:4px 0 0">Разрывы линии — периоды без данных, они не дорисовываются.</div>';
}

// Подробности экземпляров: float, паттерн, фаза Doppler, наклейки и брелки (из открытых данных Steam).
function assetDetails(x) {
  var ds = x.details || [];
  var h = '';
  if (x.pattern) h += '<div class="card" style="color:var(--amber);font-size:14px">⚠️ Цена этого скина сильно зависит от паттерна (номер ниже). Для редких паттернов (blue gem, Fade 100%, красивые сетки и т.п.) реальная цена может быть намного выше — бот показывает обычную цену по названию.</div>';
  if (!ds.length) return h;
  h += '<div class="sec">' + (ds.length > 1 ? 'Твои экземпляры (' + ds.length + ')' : 'Твой экземпляр') + '</div>';
  ds.forEach(function (a, i) {
    var rows = '';
    if (a.float != null) rows += kv('Float', a.float.toFixed(a.float < 0.01 ? 6 : 4) + (a.floatNote ? '<div style="font-size:12px;font-weight:400;color:var(--amber);white-space:normal">' + esc(a.floatNote) + '</div>' : ''));
    if (a.seed != null) rows += kv('Паттерн', '#' + a.seed);
    if (a.phase) rows += kv('Фаза', esc(a.phase) + (a.phaseKop ? '<div style="font-size:12px;font-weight:400" class="mut">на сайтах от ≈ ' + uahShort(a.phaseKop) + '</div>' : ''));
    a.stickers.forEach(function (st) { rows += kv('🏷️ ' + esc(st.name.replace(/^Sticker \| /, '')), (st.kop ? '≈ ' + uahShort(st.kop) : '—') + (st.wear > 0.05 ? '<div style="font-size:12px;font-weight:400" class="mut">потёрта ' + Math.round(st.wear * 100) + '%</div>' : '')); });
    a.charms.forEach(function (c) { rows += kv('🔗 ' + esc(c.name.replace(/^Charm \| /, '')), (c.kop ? '≈ ' + uahShort(c.kop) : '—') + (c.pattern != null ? '<div style="font-size:12px;font-weight:400" class="mut">шаблон #' + c.pattern + '</div>' : '')); });
    if (a.stickersKop) rows += kv('Наклейки и брелки вместе', '≈ ' + uahShort(a.stickersKop));
    h += '<div class="card">' + (ds.length > 1 ? '<div class="mut" style="font-size:12px;margin-bottom:4px">#' + (i + 1) + '</div>' : '') + (rows || '<span class="mut">Нет данных</span>') + '</div>';
  });
  if (ds.some(function (a) { return a.stickers.length || a.charms.length; })) h += '<div class="note">Цена наклеек — отдельно, по их средней цене в Steam. К цене скина они обычно добавляют немного (часто 0–10% своей стоимости); дорогие и редкие — больше. Потёртые наклейки ценятся меньше.</div>';
  if (ds.some(function (a) { return a.phase; })) h += '<div class="note">Цена фазы — самое дешёвое объявление этой фазы на CSFloat (открытый прайс). В Steam у Doppler одна цена на все фазы, поэтому для Ruby/Sapphire/Black Pearl/Emerald она сильно занижена.</div>';
  return h;
}

          var raw = s.kind === 'uah' ? (Number(s.value) / 100).toString().replace('.', ',') : s.kind === 'percent' ? (Number(s.value) / 100).toString().replace('.', ',') : s.value;
          h += '<div class="kv" style="align-items:center"><span>' + esc(s.label) + (s.hint ? '<div class="mut" style="font-size:12px">' + esc(s.hint) + '</div>' : '') + '</span><input data-k="' + k + '" inputmode="decimal" value="' + esc(raw) + '" style="width:96px;text-align:right;padding:8px 10px">' + '</div>';
        }
      });
      h += '</div>';
    });
    $('#sc').innerHTML = h;
    Array.prototype.forEach.call($('#sc').querySelectorAll('[data-k]'), function (el) {
      var k = el.getAttribute('data-k');
      var save = function () {
        var val = el.type === 'checkbox' ? el.checked : el.value;
        api('settings', { method: 'POST', body: { key: k, value: val } }).then(function () { haptic('ok'); toast('Сохранено'); }).catch(function (e) { toast(e.message); });
      };
      if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.onchange = save; else el.onchange = save;
    });
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; });
}
function status() {
  sheet('<div class="skel"></div><div class="skel"></div>');
  api('status').then(function (r) {
    var h = '<h2>Состояние системы</h2><div class="sub">' + (r.collector ? 'Steam и Skinport опрашивает сборщик GitHub Actions' : '') + '</div>';
    h += '<div class="card">' + r.sources.map(function (s) {
      return '<div class="kv"><span class="k">' + (SRC[s.source] || esc(s.source)) + (s.status !== 'ok' && (s.error || s.disabled) ? '<div style="font-size:12px;color:var(--hint)">' + esc(s.disabled || s.error) + '</div>' : '') + '</span><span class="v">' + srcStatus(s) + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="sec">Курсы НБУ</div><div class="card">' + (r.fx.length ? r.fx.map(function (f) { return kv('1 ' + f.base, f.rate.toFixed(4).replace('.', ',') + ' ₴ <span class="mut">(' + f.date + ')</span>'); }).join('') : '<span class="mut">ещё не загружены</span>') + '</div>';
    h += '<div class="sec">Задачи</div><div class="card">' + r.jobs.map(function (j) { return kv(esc(j.name), j.enabled ? (j.fails ? '⚠️ ошибок: ' + j.fails : '✅') : '⏸ выключена'); }).join('') + '</div>';
    if (r.jobs.some(function (j) { return !j.enabled; })) h += '<button class="btn sec2" id="jen">Включить отключённые задачи</button>';
    h += '<div class="sec">Сегодня</div><div class="card">' + kv('Снимков цен', r.counters.snapshots || 0) + kv('Уведомлений', r.counters.notifications || 0) + kv('Каталог для поиска', r.catalog.count ? r.catalog.count.toLocaleString('ru-RU') + ' названий' : 'ещё не загружен') + '</div>';
    if (r.errors.length) h += '<div class="sec">Последние ошибки</div><div class="card">' + r.errors.map(function (e) { return '<div class="kv"><span class="k">' + ago(e.at) + ' · ' + esc(e.source || '') + '</span><span class="v" style="font-size:13px;font-weight:400">' + esc(e.message.slice(0, 90)) + '</span></div>'; }).join('') + '</div>';
    $('#sc').innerHTML = h;
    if ($('#jen')) $('#jen').onclick = function () { api('jobs/enable', { method: 'POST' }).then(function () { toast('Включено'); status(); }); };
  }).catch(function (e) { $('#sc').innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; });
}

if (!INIT) { view.innerHTML = '<div class="empty"><div class="e">🔒</div>Открой приложение из своего бота в Telegram — кнопкой «Приложение» рядом с полем ввода.</div>'; return; }
var start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
go(['deals', 'market', 'inv', 'more'].indexOf(start) >= 0 ? start : 'home');
})();
</script>
