name: probe2
on: { push: { branches: [probe2] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const base = 'https://steamcommunity.com/market/search/render/?appid=730&norender=1&search_descriptions=0&sort_column=name&sort_dir=asc';
          const tries = [
            base + '&start=0&count=100',
            base + '&start=0&count=1000',
            base + '&start=0&count=500&currency=18',
            base + '&start=100&count=100&currency=18&country=UA&l=russian',
          ];
          for (const u of tries) {
            try {
              const r = await fetch(u, { headers: { 'User-Agent': 'cs2-market-bot-collector/1.0 (personal price monitor)' } });
              const t = await r.text();
              let j = null; try { j = JSON.parse(t); } catch {}
              console.log('####', r.status, u.split('?')[1]);
              if (j) console.log('total', j.total_count, 'got', j.results?.length, 'start', j.start, 'pagesize', j.pagesize, JSON.stringify(j.results?.[0])?.slice(0, 700));
              else console.log(t.slice(0, 200));
            } catch (e) { console.log('ERR', e.message); }
            await new Promise((r) => setTimeout(r, 4000));
          }
          JS
          node p.mjs
