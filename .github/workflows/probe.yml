name: probe
on: { push: { branches: [probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const urls = [
            'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins_not_grouped.json',
            'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/all.json',
            'https://market.csgo.com/api/v2/prices/USD.json',
            'https://market.csgo.com/api/v2/prices/class_instance/USD.json',
            'https://api.waxpeer.com/v1/prices?game=csgo&minified=1',
            'https://api.dmarket.com/exchange/v1/market/items?gameId=a8db&limit=2&currency=USD&title=Revolution%20Case',
            'https://api.dmarket.com/price-aggregator/v1/aggregated-prices?Titles=Revolution%20Case&Limit=10',
            'https://bitskins.com/api/v2/market/insell/730',
            'https://api.bitskins.com/market/insell/730',
            'https://www.skinbaron.com/api/v2/Browsing/FilterOffers?appId=730&str=Revolution%20Case',
            'https://white.market/api/public/v1/market/prices',
            'https://api.lis-skins.com/v1/market/prices?game=csgo',
            'https://lis-skins.com/market_export_json/api_csgo_full.json',
            'https://lis-skins.com/market_export_json/csgo.json',
            'https://csfloat.com/api/v1/listings?market_hash_name=Revolution%20Case&limit=1',
            'https://api.shadowpay.com/api/v2/user/items/prices',
            'https://tradeit.gg/api/v2/inventory/data?gameId=730&limit=1',
            'https://gamerpay.gg/api/prices',
          ];
          for (const u of urls) {
            try {
              const r = await fetch(u, { headers: { 'User-Agent': 'cs2-market-bot-collector/1.0', 'Accept-Encoding': 'gzip, br' } });
              const t = await r.text();
              console.log('====', r.status, t.length, u);
              console.log(t.slice(0, 600).replace(/\s+/g, ' '));
            } catch (e) { console.log('====', 'ERR', u, e.message); }
          }
          JS
          node p.mjs
